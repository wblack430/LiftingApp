/* ---------- Tokens ---------- */
:root {
  color-scheme: dark;
  --bg: #000;            /* page */
  --raised: #161616;     /* sheets */
  --pressed: #2a2a2a;    /* pressed state */
  --rule: #383838;       /* row dividers */
  --outline: #6f6f6f;    /* control outlines, 4:1 on black */
  --ink: #fff;           /* text and primary actions */
  --ink-2: #c9c9c9;      /* secondary text */
  --ink-3: #9a9a9a;      /* placeholders */
  --clock: #ffb300;      /* the rest timer, nothing else */
  --danger: #ff6b6b;     /* destructive actions and errors */
  --ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --num: "Barlow Condensed", "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --pad: 16px;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  height: 100%; margin: 0; overflow: hidden;
  background: var(--bg); color: var(--ink);
  font: 400 17px/1.4 var(--ui);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none; user-select: none;
  touch-action: manipulation;
  overscroll-behavior: none;
}
h1, h2, h3, p, figure { margin: 0; }
button, input { font: inherit; color: inherit; margin: 0; }
button {
  -webkit-appearance: none; appearance: none;
  padding: 0; border: 0; border-radius: 0; background: none;
  cursor: pointer; touch-action: manipulation;
}
input { -webkit-user-select: text; user-select: text; }
[hidden] { display: none !important; }
:focus { outline: none; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ---------- App shell: timer bar, scrolling view, tab bar ---------- */
#app {
  display: flex; flex-direction: column;
  height: 100vh; height: 100dvh;
  max-width: 560px; margin: 0 auto;
  padding: 0 var(--safe-r) 0 var(--safe-l);
}
#views { position: relative; flex: 1 1 auto; min-height: 0; }
.view { position: absolute; inset: 0; display: flex; flex-direction: column; }
.scroll {
  flex: 1 1 auto; min-height: 0;
  overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  padding: 12px var(--pad) 36px;
}
.actionbar { flex: none; padding: 10px var(--pad) 12px; border-top: 1px solid var(--rule); background: var(--bg); }

#tabs { flex: none; display: flex; padding-bottom: var(--safe-b); border-top: 1px solid var(--rule); background: var(--bg); }
#tabs button {
  position: relative; flex: 1 1 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  height: 58px; color: var(--ink-3);
  font: 500 12px/1 var(--ui);
}
#tabs button[aria-current="page"] { color: var(--ink); }
#tabs button[aria-current="page"]::before {
  content: ""; position: absolute; top: -1px; left: 24%; right: 24%;
  height: 3px; border-radius: 0 0 3px 3px; background: var(--ink);
}
#tabs button:focus-visible { outline-offset: -4px; }

/* ---------- Type ---------- */
.title { margin: 6px 0 14px; font: 600 36px/1.05 var(--num); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 6px 0 14px; }
.title-row .title { margin: 0; }
.sub { margin: 28px 0 10px; font: 600 24px/1.15 var(--num); }
.muted { color: var(--ink-2); font-size: 15px; line-height: 1.45; }
.muted + .muted { margin-top: 8px; }
.sub-first { margin-top: 0; }
.sub + .day { margin-top: 0; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; padding: 0 18px;
  border: 2px solid var(--outline); border-radius: 12px;
  color: var(--ink); font: 600 21px/1.05 var(--num); text-align: center;
}
.btn:active { background: var(--pressed); }
.btn-primary { min-height: 58px; border-color: var(--ink); background: var(--ink); color: #000; font-size: 24px; }
.btn-primary:active { border-color: #c9c9c9; background: #c9c9c9; }
.btn-danger { border-color: var(--danger); color: var(--danger); }
.btn-small { min-height: 44px; padding: 0 14px; font-size: 19px; }
.btn-block { display: flex; width: 100%; }
.btn[disabled] { opacity: .4; }
.icon-btn {
  flex: none; display: inline-flex; align-items: center; justify-content: center;
  width: 48px; height: 48px; border-radius: 12px; color: var(--ink);
}
.icon-btn:active { background: var(--pressed); }
.icon-btn[disabled] { opacity: .3; }
.stack { display: grid; gap: 10px; }
.actions { display: grid; gap: 10px; margin-top: 20px; }
.actions-tight { margin-top: 14px; }

/* ---------- Form controls ---------- */
.form { display: grid; gap: 14px; }
.block { display: grid; gap: 14px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field { min-width: 0; }
.field > label { display: block; margin-bottom: 6px; color: var(--ink-2); font-size: 15px; line-height: 1.2; }
.field-err { margin-top: 6px; color: var(--danger); font-size: 15px; line-height: 1.3; }
.field-err:empty { display: none; }
.input {
  display: block; width: 100%; min-width: 0; height: 56px; padding: 0 14px;
  border: 2px solid var(--outline); border-radius: 12px;
  background: #000; color: var(--ink);
  font: 400 18px/1.2 var(--ui);
  -webkit-appearance: none; appearance: none;
}
.input::placeholder { color: var(--ink-3); opacity: 1; }
.input:focus, .input:focus-visible { outline: none; border-color: var(--ink); }
.input[aria-invalid="true"] { border-color: var(--danger); }
input[type="date"].input { text-align: left; }
input[type="date"].input::-webkit-date-and-time-value { text-align: left; }
.num-input { padding: 0 4px; text-align: center; font: 600 28px/1 var(--num); font-variant-numeric: tabular-nums; }
.stepper { display: flex; gap: 6px; }
.stepper .num-input { flex: 1 1 0; }
.step {
  flex: none; width: 48px; height: 56px;
  border: 2px solid var(--outline); border-radius: 12px;
  color: var(--ink); font: 600 30px/1 var(--num);
}
.step:active { background: var(--pressed); }

.type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.chip {
  min-height: 46px; padding: 0 12px;
  border: 2px solid var(--outline); border-radius: 999px;
  color: var(--ink); font: 600 19px/1.05 var(--num);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.chip:active { background: var(--pressed); }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: #000; }
.type-grid .chip { padding: 4px 10px; white-space: normal; overflow: visible; overflow-wrap: anywhere; }

.seg2 { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 2px solid var(--outline); border-radius: 12px; overflow: hidden; }
.seg2 button { min-height: 42px; padding: 0 10px; color: var(--ink-2); font: 600 18px/1 var(--num); }
.seg2 button + button { border-left: 2px solid var(--outline); }
.seg2 button[aria-pressed="true"] { background: var(--ink); color: #000; }
.seg2 button:focus-visible { outline-offset: -4px; }

.recents {
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
  margin: 8px calc(var(--pad) * -1) 0; padding: 0 var(--pad);
}
.recents::-webkit-scrollbar { display: none; }
.recents:empty { display: none; }
.recents .chip { flex: none; min-height: 42px; max-width: 240px; font-size: 18px; }
/* Workout picker on the Log tab */
.starts { margin-bottom: 16px; }
.start-row {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  width: 100%; min-height: 74px; margin-top: 10px; padding: 10px 16px;
  border: 2px solid var(--outline); border-radius: 14px; color: var(--ink); text-align: left;
}
.start-row:active { background: var(--pressed); }
.start-main { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.start-name { font: 600 26px/1.1 var(--num); overflow-wrap: anywhere; }
.start-count { flex: none; display: flex; flex-direction: column; align-items: center; min-width: 48px; }
.start-count b { font: 600 32px/1 var(--num); }
.start-count small { color: var(--ink-2); font-size: 13px; }
#log-form { margin-top: 14px; }
/* Exercise rows with move buttons, in the routine editor */
.item-row { display: flex; align-items: center; gap: 2px; border-bottom: 1px solid var(--rule); }
.item-row .row { flex: 1 1 0; min-width: 0; border-bottom: 0; }
.item-row .row-a, .item-row .row-b { min-width: 0; }
.move { width: 40px; height: 48px; }
.head-tools { flex: none; display: flex; gap: 2px; }
.hint { margin-top: 8px; color: var(--ink-2); font-size: 15px; line-height: 1.35; }
[hidden] + .field-err + [hidden] + .hint { margin-top: 0; }
.hint:empty { display: none; }

/* ---------- Log tab ---------- */
.date-row { display: flex; align-items: center; gap: 4px; margin-bottom: 12px; }
.date-pick {
  position: relative; flex: 1 1 auto; min-width: 0;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 48px; padding: 6px 12px; border-radius: 12px;
}
.date-pick input {

  -webkit-appearance: none; appearance: none;
}
.date-pick:focus-within { outline: 3px solid var(--ink); outline-offset: 2px; }
.date-main { font: 600 26px/1 var(--num); white-space: nowrap; }
.date-side { color: var(--ink-2); font-size: 15px; line-height: 1; white-space: nowrap; }
.date-pick.past { background: var(--ink); }
.date-pick.past .date-main { color: #000; }
.date-pick.past .date-side { color: #2e2e2e; }

/* ---------- Logbook rows (Log, Routines, History) ---------- */
.day { margin-top: 26px; }
.day-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 48px; border-bottom: 2px solid var(--ink); }
.day-head h2, .day-head h3 { font: 600 24px/1.1 var(--num); overflow-wrap: anywhere; }
.type-head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  padding: 14px 0 4px; color: var(--ink-2); font: 600 15px/1.2 var(--ui);
}
.type-head .tot { font: 600 17px/1 var(--num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto auto; column-gap: 14px; align-items: center;
  width: 100%; min-height: 56px; padding: 9px 0;
  border-bottom: 1px solid var(--rule);
  color: var(--ink); text-align: left;
}
button.row:active { background: var(--pressed); }
button.row:focus-visible { outline-offset: -3px; }
.row-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.row-name { font-size: 17px; line-height: 1.25; overflow-wrap: anywhere; }
.row-sub { color: var(--ink-2); font-size: 14px; line-height: 1.3; overflow-wrap: anywhere; }
.row-a, .row-b { font: 600 21px/1 var(--num); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.row-a { min-width: 70px; }
.row-b { min-width: 58px; }

/* Workout in progress: the same rows with a check mark in front */
.plan-count { margin: 10px 0 2px; }
.row.plan { grid-template-columns: 26px minmax(0, 1fr) auto auto; column-gap: 12px; }
.mark { display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; border: 2px solid var(--outline); border-radius: 50%; }
.plan.next .mark { border-color: var(--ink); }
.plan.next .row-name { font-weight: 600; }
.plan.done .mark { border-color: var(--ink); background: var(--ink); color: #000; }
.plan.done .row-name { color: var(--ink-2); }
.cue { margin-bottom: 14px; }
#next-btn span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.routine { margin-top: 26px; }
.routine:first-of-type { margin-top: 0; }
.routine-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.routine-actions .btn-primary { grid-column: 1 / -1; }
.starter-note { margin-top: 14px; }
.empty { margin: 24px 0 18px; }
.empty h2 { margin-bottom: 6px; font: 600 26px/1.1 var(--num); }
.empty p { max-width: 34ch; margin-bottom: 18px; color: var(--ink-2); }

/* ---------- History ---------- */
.week-grid { display: grid; grid-template-columns: repeat(3, 1fr); }
.week-grid div { padding: 2px 12px; border-left: 1px solid var(--rule); }
.week-grid div:first-child { padding-left: 0; border-left: 0; }
.week-grid b { display: block; font: 600 34px/1.05 var(--num); }
.week-grid span { color: var(--ink-2); font-size: 14px; }
.chart-controls { display: grid; gap: 8px; margin-top: 28px; }
.chart-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 18px 0 10px; }
.chart-head h3 { font: 600 24px/1.15 var(--num); }
.chart-note { color: var(--ink-2); font-size: 14px; }
.chart-note:empty { display: none; }
.chart-box { position: relative; height: 230px; }
.chart-box.is-table, .chart-box.is-empty { height: auto; }
.chart-box.is-empty { padding: 8px 0; }
.chart-offline { margin-bottom: 8px; }
.data-table { width: 100%; border-collapse: collapse; }
.data-table th { padding: 8px 0; border-bottom: 2px solid var(--ink); color: var(--ink-2); font-size: 14px; font-weight: 600; text-align: left; }
.data-table td { padding: 9px 0; border-bottom: 1px solid var(--rule); font-size: 16px; }
.data-table .r { text-align: right; }
.data-table td.r { font: 600 20px/1 var(--num); font-variant-numeric: tabular-nums; }
.more { margin-top: 24px; }

/* ---------- Settings ---------- */
.set-row {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  width: 100%; min-height: 58px; padding: 6px 0;
  border-bottom: 1px solid var(--rule); text-align: left; font-size: 17px;
}
.set-row small { display: block; color: var(--ink-2); font-size: 14px; }
.switch { position: relative; flex: none; width: 60px; height: 34px; border: 2px solid var(--outline); border-radius: 999px; }
.switch::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px;
  border-radius: 50%; background: var(--ink-2); transition: transform .15s;
}
[aria-checked="true"] > .switch { border-color: var(--ink); background: var(--ink); }
[aria-checked="true"] > .switch::after { background: #000; transform: translateX(26px); }
.presets-label { margin: 14px 0 8px; }
.presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.banner { margin-bottom: 18px; padding: 12px 14px; border: 2px solid var(--ink); border-radius: 12px; font-size: 15px; line-height: 1.4; }
.about { margin-top: 28px; }

/* ---------- Rest timer bar ---------- */
#timer { flex: none; padding-top: var(--safe-t); border-bottom: 1px solid var(--rule); background: var(--bg); }
.t-row {
  --on: var(--clock); --off: rgba(255, 179, 0, .11);
  display: flex; align-items: center; gap: 6px;
  height: 60px; padding: 0 10px;
  background: var(--bg); color: var(--ink);
}
.t-open {
  flex: none; display: flex; align-items: center; justify-content: center;
  min-width: 44px; height: 48px; padding: 0 6px; border-radius: 10px; color: var(--ink-2);
}
.t-open:active { background: var(--pressed); }
.t-open .seg { display: none; }
#timer:not([data-state="idle"]) .t-open .seg { display: flex; }
#timer:not([data-state="idle"]) .t-open .ico { display: none; }
.t-round { flex: none; padding-left: 2px; color: var(--ink-2); font-size: 15px; white-space: nowrap; }
.t-presets { flex: 1 1 auto; display: flex; gap: 6px; min-width: 0; }
.t-ctrl { flex: 1 1 auto; display: none; justify-content: flex-end; gap: 6px; }
.t-btn {
  flex: 1 1 0; min-width: 0; height: 44px; padding: 0 6px;
  display: inline-flex; align-items: center; justify-content: center;
  border: 2px solid var(--outline); border-radius: 10px;
  color: inherit; font: 600 21px/1 var(--num); white-space: nowrap;
}
.t-btn:active { background: var(--pressed); }
.t-ico { flex: none; width: 44px; padding: 0; }
.t-ctrl .t-btn { flex: none; min-width: 60px; }
.t-ctrl .t-ico { min-width: 44px; }
#t-repeat, #t-stop { display: none; }
#t-repeat[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: #000; }
#timer[data-state="idle"] #t-repeat { display: inline-flex; }
#timer:not([data-state="idle"]) #t-stop { display: inline-flex; }
#timer[data-state="running"] .t-presets, #timer[data-state="paused"] .t-presets { display: none; }
#timer[data-state="running"] .t-ctrl, #timer[data-state="paused"] .t-ctrl { display: flex; }
#timer[data-invert] .t-row { --on: #000; --off: rgba(0, 0, 0, .13); background: var(--clock); color: #000; }
#timer[data-invert] .t-btn { border-color: #000; }
#timer[data-invert] .t-btn:active { background: rgba(0, 0, 0, .15); }
#timer[data-invert] .t-round { color: #000; }
.t-progress { height: 3px; }
.t-progress i, .b-progress i { display: block; height: 100%; background: var(--clock); transform: scaleX(0); transform-origin: left center; transition: transform .2s linear; }

/* Seven-segment digits, like the LED clock on a gym wall */
.seg { display: flex; align-items: center; gap: 3px; }
.seg svg { display: block; height: 34px; width: auto; }
.seg .d { aspect-ratio: 56 / 100; }
.seg .c { aspect-ratio: 20 / 100; }
.seg polygon { fill: var(--off); }
.seg .on { fill: var(--on); }
[data-state="paused"] .seg { opacity: .5; }

/* ---------- Full-screen timer ---------- */
#bigtimer {
  --on: var(--clock); --off: rgba(255, 179, 0, .12); --knob: #000;
  position: fixed; inset: 0; z-index: 30;
  display: flex; flex-direction: column;
  padding: calc(var(--safe-t) + 6px) calc(var(--safe-r) + 16px) calc(var(--safe-b) + 16px) calc(var(--safe-l) + 16px);
  background: var(--bg); color: var(--ink);
}
#bigtimer[data-invert] { --on: #000; --off: rgba(0, 0, 0, .11); --knob: var(--clock); background: var(--clock); color: #000; }
.b-top { flex: none; display: flex; justify-content: flex-end; }
.b-x { display: inline-flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 12px; color: inherit; }
.b-main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
#b-seg .seg { --h: min(calc(88vw / var(--cells, 2.12)), 42vh); --h: min(calc(88vw / var(--cells, 2.12)), 42dvh); gap: calc(var(--h) * .045); }
#b-seg .seg svg { height: var(--h); }
.b-progress { width: 100%; max-width: 520px; height: 6px; }
#bigtimer[data-invert] .b-progress i { background: #000; }
.b-label { font: 600 30px/1 var(--num); }
.b-foot { flex: none; display: grid; gap: 10px; width: 100%; max-width: 520px; margin: 0 auto; }
.b-row { display: flex; gap: 10px; }
.b-btn, .b-row .t-btn {
  flex: 1 1 0; min-width: 0; height: 60px;
  border: 2px solid currentColor; border-radius: 12px;
  color: inherit; font: 600 26px/1 var(--num);
}
.b-btn:active, .b-row .t-btn:active { background: rgba(128, 128, 128, .3); }
.b-btn[disabled] { opacity: .35; }
.b-switch { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 52px; color: inherit; font-size: 17px; text-align: left; }
#bigtimer .switch { border-color: currentColor; }
#bigtimer .switch::after { background: currentColor; }
#bigtimer [aria-checked="true"] > .switch { background: currentColor; }
#bigtimer [aria-checked="true"] > .switch::after { background: var(--knob); }
@media (orientation: landscape) and (max-height: 520px) {
  .b-main { gap: 8px; }
  #b-seg .seg { --h: min(calc(60vw / var(--cells, 2.12)), 38vh); --h: min(calc(60vw / var(--cells, 2.12)), 38dvh); }
  .b-label { font-size: 22px; }
  .b-foot { grid-template-columns: 1fr 1fr; max-width: none; }
  .b-btn, .b-row .t-btn { height: 48px; font-size: 22px; }
  .b-switch { grid-column: 1 / -1; min-height: 40px; }
}

/* ---------- Sheets ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; justify-content: flex-end; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, .72); opacity: 0; transition: opacity .2s; }
.sheet {
  position: relative; width: 100%; max-width: 560px; margin: 0 auto;
  max-height: calc(100vh - var(--safe-t) - 20px); max-height: calc(100dvh - var(--safe-t) - 20px);
  overflow-y: auto; overscroll-behavior: contain;
  padding: 0 var(--pad) calc(var(--safe-b) + 20px);
  border: 1px solid #4d4d4d; border-bottom: 0; border-radius: 20px 20px 0 0;
  background: var(--raised);
  transform: translateY(100%); transition: transform .24s cubic-bezier(.2, .8, .2, 1);
}
.sheet-wrap.open .sheet { transform: none; }
.sheet-wrap.open .sheet-backdrop { opacity: 1; }
.sheet-head {
  position: sticky; top: 0; z-index: 1;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  margin: 0 -4px 6px 0; padding: 10px 0 6px; background: var(--raised);
}
.sheet-head h2 { font: 600 28px/1.1 var(--num); overflow-wrap: anywhere; }
.sheet p { line-height: 1.45; }

/* ---------- Toast ---------- */
#toasts { position: fixed; z-index: 50; top: calc(var(--safe-t) + 70px); left: 0; right: 0; display: flex; justify-content: center; padding: 0 12px; pointer-events: none; }
.toast {
  display: flex; align-items: center; gap: 12px;
  width: 100%; max-width: 520px; min-height: 52px; padding: 8px 8px 8px 16px;
  border-radius: 12px; background: var(--ink); color: #000;
  font: 500 16px/1.3 var(--ui); box-shadow: 0 10px 28px rgba(0, 0, 0, .7);
  pointer-events: auto; opacity: 0; transform: translateY(-10px); transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: none; }
.toast span { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.toast button { flex: none; height: 40px; padding: 0 14px; border: 2px solid #000; border-radius: 10px; color: #000; font: 600 19px/1 var(--num); }

/* ---------- Small screens, reduced motion ---------- */
@media (max-width: 350px) {
  .step { width: 40px; }
  .t-round { display: none; }
  .t-row { gap: 4px; padding: 0 8px; }
  .t-presets { gap: 4px; }
  .t-open { min-width: 40px; padding: 0 2px; }
  .t-open .seg svg { height: 28px; }
  .chip { font-size: 17px; }
  .row-a { min-width: 60px; }
  .row-b { min-width: 50px; }
}
@media (orientation: landscape) and (max-height: 480px) {
  .t-row { height: 52px; }
  #tabs button { flex-direction: row; gap: 8px; height: 46px; font-size: 13px; }
  .actionbar { padding: 6px var(--pad) 8px; }
  .actionbar .btn-primary { min-height: 46px; font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}
</style>

<body>

<div id="app">
  <header id="timer" data-state="idle">
    <div class="t-row">
      <button type="button" id="t-open" class="t-open" aria-label="Open full-screen timer"></button>
      <span id="t-round" class="t-round" hidden></span>
      <div id="t-presets" class="t-presets" role="group" aria-label="Start rest timer"></div>
      <div class="t-ctrl">
        <button type="button" id="t-add" class="t-btn" aria-label="Add 15 seconds">+15s</button>
        <button type="button" id="t-toggle" class="t-btn t-ico" aria-label="Pause timer"></button>
      </div>
      <button type="button" id="t-repeat" class="t-btn t-ico" aria-pressed="false" aria-label="Repeat timer for intervals"></button>
      <button type="button" id="t-stop" class="t-btn t-ico" aria-label="Stop timer"></button>
    </div>
    <div class="t-progress" aria-hidden="true"><i id="t-bar"></i></div>
  </header>

  <main id="views">
    <section id="view-log" class="view" aria-label="Log">
      <div class="scroll" id="log-scroll">
        <h1 class="sr-only">Log a workout</h1>
        <div class="date-row">
          <button type="button" id="d-prev" class="icon-btn" aria-label="Previous day"></button>
          <div class="date-pick" id="d-pick">
            <span class="date-main" id="d-main"></span>
            <span class="date-side" id="d-side"></span>
            <input type="date" id="d-input" aria-label="Workout date">
          </div>
          <button type="button" id="d-next" class="icon-btn" aria-label="Next day"></button>
        </div>
        <div id="free-log">
          <div id="starts" class="starts"></div>
          <button type="button" id="free-toggle" class="btn btn-block">Log a single exercise</button>
          <form id="log-form" novalidate autocomplete="off" hidden></form>
        </div>
        <section id="workout" aria-label="Workout in progress" hidden></section>
        <h2 class="sub" id="logged-title">Logged today</h2>
        <div id="logged-list"></div>
      </div>
      <div class="actionbar" id="log-bar" hidden>
        <button type="submit" form="log-form" id="log-btn" class="btn btn-primary btn-block">Log entry</button>
        <button type="button" id="next-btn" class="btn btn-primary btn-block" hidden><span></span></button>
      </div>
    </section>
    <section id="view-routines" class="view" aria-label="Routines" hidden><div class="scroll" id="routines-body"></div></section>
    <section id="view-history" class="view" aria-label="History" hidden><div class="scroll" id="history-body"></div></section>
    <section id="view-settings" class="view" aria-label="Settings" hidden><div class="scroll" id="settings-body"></div></section>
  </main>

  <nav id="tabs" aria-label="Sections">
    <button type="button" data-tab="log" aria-current="page"><span>Log</span></button>
    <button type="button" data-tab="routines"><span>Routines</span></button>
    <button type="button" data-tab="history"><span>History</span></button>
    <button type="button" data-tab="settings"><span>Settings</span></button>
  </nav>
</div>

<div id="bigtimer" data-state="idle" role="dialog" aria-modal="true" aria-label="Rest timer" hidden>
  <div class="b-top"><button type="button" id="b-close" class="b-x" aria-label="Close full-screen timer"></button></div>
  <div class="b-main">
    <div id="b-seg"></div>
    <div class="b-progress" aria-hidden="true"><i id="b-bar"></i></div>
    <p id="b-label" class="b-label"></p>
  </div>
  <div class="b-foot">
    <div id="b-presets" class="b-row" role="group" aria-label="Start rest timer"></div>
    <div class="b-row">
      <button type="button" id="b-add" class="b-btn" aria-label="Add 15 seconds">+15s</button>
      <button type="button" id="b-toggle" class="b-btn">Pause</button>
      <button type="button" id="b-stop" class="b-btn">Stop</button>
    </div>
    <button type="button" id="b-repeat" class="b-switch" role="switch" aria-checked="false"><span>Repeat for intervals</span><span class="switch" aria-hidden="true"></span></button>
  </div>
</div>

<div id="sheets"></div>
<div id="toasts" role="status" aria-live="polite"></div>
<p id="announce" class="sr-only" aria-live="assertive"></p>
<input type="file" id="import-file" class="sr-only" accept=".json,application/json" tabindex="-1" aria-hidden="true">
<noscript><p class="banner">Workout Log needs JavaScript turned on.</p></noscript>

<script>
(() => {
'use strict';

/* =====================================================================
   Workout Log
   One file, no account, no server. Everything is kept in localStorage
   on this device. Sections below: helpers, storage, shared UI pieces,
   entry form, the four tabs, rest timer, startup.
   ===================================================================== */

/* ---------- Helpers ---------- */
const $ = (sel, root = document) => root.querySelector(sel);

const clone = obj => JSON.parse(JSON.stringify(obj));
const count = (n, one, many = one + 's') => `${n.toLocaleString('en-US')} ${n === 1 ? one : many}`;
const uid = () => (window.crypto && crypto.randomUUID)
  ? crypto.randomUUID()
  : 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);

/* Build an element. Text always goes in as text, never as HTML. */

  const el = document.createElement(tag);

    if (key === 'class') el.className = val;

    else if (key.startsWith('on')) el.addEventListener(key.slice(2), val);

    if (kid == null || kid === false || kid === '') continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));

}

  el.replaceChildren(...kids.flat(Infinity).filter(kid => kid != null && kid !== false && kid !== ''));

function sv(tag, attrs, ...kids) {
  const el = document.createElementNS(SVG_NS, tag);
  for (const key in attrs || {}) el.setAttribute(key, attrs[key]);
  el.append(...kids);
  return el;
}

const ICONS = {
  x: '<path d="M6 6l12 12M18 6 6 18"/>',
  up: '<path d="M6 14.5l6-6 6 6"/>',
  down: '<path d="M6 9.5l6 6 6-6"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5" stroke-width="3"/>',
  prev: '<path d="M15 5l-7 7 7 7"/>',
  next: '<path d="M9 5l7 7-7 7"/>',

    h('div', { class: 'cols' }, field('Sets', sIn, stepper(sIn, 1, 'sets')), field('Reps', rIn, stepper(rIn, 1, 'reps'))));
  const distBlock = h('div', { class: 'block' },
    h('div', { class: 'cols' }, field('Distance (mi)', dIn), field('Time', tIn)),
    pace,
    field('Load (lbs)', lIn, stepper(lIn, 5, 'load')));

  const modeSwitch = h('div', { class: 'seg2', role: 'group', 'aria-label': 'What to record' }, repsBtn, distBtn);
  const nameField = h('div', { class: 'field' }, exLabel, exIn, h('p', { class: 'field-err', role: 'alert' }), recents, hint);
  const el = h('div', { class: 'form' },
    dateIn && field('Date', dateIn),
    typeGrid, modeSwitch, nameField,
    repsBlock, distBlock, notesIn);
  /* numbersOnly: the exercise is already decided (a planned exercise in a workout), so only the numbers and notes show. */
  if (opts.numbersOnly) for (const part of [typeGrid, modeSwitch, exLabel, exIn, recents]) part.hidden = true;

  function clearErrors() {
    for (const node of el.querySelectorAll('[aria-invalid]')) node.removeAttribute('aria-invalid');
    for (const node of el.querySelectorAll('.field-err')) node.textContent = '';
  }
  function drawTypes() {
    const list = S.types.some(t => t.name === type) ? S.types : [...S.types, { name: type, mode }];
    typeGrid.replaceChildren(...list.map(t => h('button', {
      type: 'button', class: 'chip', 'aria-pressed': String(t.name === type),
      onclick: () => { type = t.name; setMode(t.mode); drawTypes(); drawRecents(); changed(); },
    }, t.name)));
  }
  function setMode(next) {
    mode = next;
    repsBtn.setAttribute('aria-pressed', String(mode === 'reps'));
    distBtn.setAttribute('aria-pressed', String(mode === 'dist'));
    repsBlock.hidden = mode !== 'reps';
    distBlock.hidden = mode !== 'dist';
    exLabel.textContent = mode === 'dist' ? 'Name (optional)' : 'Exercise';
    exIn.placeholder = mode === 'dist' ? `Defaults to ${type}` : 'Bench press';
    if (!opts.numbersOnly) {
      /* Strength only: nothing to choose, so the type and mode controls stay out of the way. An old run still shows them when edited. */
      const plain = S.settings.strengthOnly && mode === 'reps' && type === strengthName();
      typeGrid.hidden = plain;
      modeSwitch.hidden = plain;
    }
    clearErrors();
    drawHint();
  }
  function drawRecents() {
    if (!opts.recents) return;
    const query = exIn.value.trim().toLowerCase();
    const list = recentExercises(type, 12).filter(e => !query || e.exercise.toLowerCase().includes(query));
    recents.replaceChildren(...list.map(e => h('button', { type: 'button', class: 'chip', onclick: () => useRecent(e) }, e.exercise)));
  }
  /* One tap on a recent exercise fills in what you did last time. Time is left blank on purpose. */
  function useRecent(e) {
    exIn.value = e.exercise;
    setMode(e.mode);
    if (e.mode === 'reps') { wIn.value = numStr(e.weight); sIn.value = numStr(e.sets); rIn.value = numStr(e.reps); }
    else { dIn.value = numStr(e.distance); tIn.value = ''; lIn.value = numStr(e.weight); }
    drawRecents(); drawPace(); changed();
  }
  function drawHint() {
    const name = exIn.value.trim() || (mode === 'dist' ? type : '');
    const last = (opts.recents || opts.last) && name ? lastEntry(type, name) : null;
    hint.textContent = last ? `Last time: ${describe(last)}, ${whenText(last.date)}.` : '';
    if (opts.numbersOnly) nameField.hidden = !last;       // nothing else in that block is showing
  }
  function drawPace() {
    const text = fmtPace(parseDur(tIn.value), parseNum(dIn.value));
    pace.textContent = text ? `Pace ${text}` : '';
  }

  el.addEventListener('input', ev => {
    const t = ev.target;
    if (t === tIn) {
      const masked = durMask(t.value);
      if (masked !== t.value) { t.value = masked; try { t.setSelectionRange(masked.length, masked.length); } catch (err) { /* not focusable yet */ } }
    } else if (t.classList.contains('num-input')) {
      const tidy = t.getAttribute('inputmode') === 'decimal' ? t.value.replace(/[^\d.,]/g, '') : t.value.replace(/\D/g, '');
      if (tidy !== t.value) t.value = tidy;
    }
    clearErrors();
    if (t === exIn) { drawRecents(); drawHint(); }
    drawPace();
    changed();
  });
  tIn.addEventListener('blur', () => {
    const sec = parseDur(tIn.value);
    tIn.value = sec ? fmtDur(Math.min(sec, LIMIT.duration)) : '';
    drawPace();
  });
  /* Enter moves to the next field. Only the notes field submits. */
  el.addEventListener('keydown', ev => {
    if (ev.key !== 'Enter' || ev.isComposing || ev.target.tagName !== 'INPUT' || ev.target === notesIn) return;
    ev.preventDefault();
    const visible = inputs.filter(i => i.offsetParent !== null);
    const next = visible[visible.indexOf(ev.target) + 1];
    if (next) next.focus();
  });

  /* Returns { values } or { error: [input, message] }. strict means a run needs a distance or a time. */
  function read(strict) {
    const errors = [];
    const num = (input, label, limit, whole) => {
      const n = parseNum(input.value);
      if (Number.isNaN(n)) { errors.push([input, `${label} needs to be a number.`]); return null; }
      return cleanNum(n, limit, whole);
    };
    const values = { type, mode, exercise: cleanText(exIn.value, 80), weight: null, sets: null, reps: null, distance: null, duration: null, notes: cleanText(notesIn.value, 300) };
    if (mode === 'reps') {
      if (!values.exercise) errors.push([exIn, 'Enter an exercise name.']);
      values.weight = num(wIn, 'Weight', LIMIT.weight);
      values.sets = num(sIn, 'Sets', LIMIT.sets, true);
      values.reps = num(rIn, 'Reps', LIMIT.reps, true);
    } else {
      if (!values.exercise) values.exercise = type;
      values.distance = num(dIn, 'Distance', LIMIT.distance);
      const sec = parseDur(tIn.value);
      if (Number.isNaN(sec)) errors.push([tIn, 'Enter time as minutes and seconds, like 25:30.']);
      else values.duration = cleanNum(sec, LIMIT.duration, true);
      values.weight = num(lIn, 'Load', LIMIT.weight);
      if (strict && !errors.length && !values.distance && !values.duration) errors.push([dIn, 'Enter a distance or a time.']);
    }
    const out = { values };
    if (dateIn) {
      if (!parseYmd(dateIn.value) || dateIn.value > today()) errors.unshift([dateIn, 'Pick a date that is not in the future.']);
      else out.date = dateIn.value;
    }
    return errors.length ? { error: errors[0] } : out;
  }
  function showError([input, message]) { clearErrors(); fieldError(input, message); }
  function set(v, date) {
    type = v.type;
    drawTypes();
    setMode(v.mode);
    exIn.value = v.mode === 'dist' && v.exercise === v.type ? '' : v.exercise;
    wIn.value = v.mode === 'reps' ? numStr(v.weight) : '';
    sIn.value = numStr(v.sets); rIn.value = numStr(v.reps);
    dIn.value = numStr(v.distance); tIn.value = v.duration ? fmtDur(v.duration) : '';
    lIn.value = v.mode === 'dist' ? numStr(v.weight) : '';
    notesIn.value = v.notes || '';
    if (dateIn && date) dateIn.value = date;
    drawRecents(); drawHint(); drawPace();
  }
  function clear() {
    for (const input of inputs) input.value = '';
    clearErrors(); drawRecents(); drawHint(); drawPace();
  }
  /* Called when the workout types or the log changed underneath the form. */
  function sync() {
    if (S.settings.strengthOnly && !dirty()) { type = strengthName(); mode = 'reps'; }
    else if (!S.types.some(t => t.name === type) && !dirty()) { type = S.types[0].name; mode = S.types[0].mode; }
    drawTypes(); setMode(mode); drawRecents();
  }
  const dirty = () => inputs.some(input => input.value.trim() !== '');
  const raw = () => ({ type, mode, values: inputs.map(input => input.value) });
  function restore(saved) {
    if (!saved || !Array.isArray(saved.values)) return;
    if (S.types.some(t => t.name === saved.type)) { type = saved.type; mode = saved.mode === 'dist' ? 'dist' : 'reps'; }
    inputs.forEach((input, i) => { input.value = typeof saved.values[i] === 'string' ? saved.values[i] : ''; });
    sync(); drawHint(); drawPace();
  }

  drawTypes(); setMode(mode); drawRecents();
  return { el, read, showError, set, clear, sync, dirty, raw, restore };
}

/* ---------- Changing the log ---------- */
let active = 'log';
let logDate = today();
let dateAuto = true;       // true while the Log tab should follow today's date
const targetText = () => { const n = daysAgo(logDate); return n === 0 ? 'today' : n === 1 ? 'for yesterday' : `for ${fmtDate(logDate)}`; };

function addEntries(list, message, alsoUndo) {
  S.entries.push(...list);
  save();
  refresh();
  buzz(15);
  askPersist();
  const ids = new Set(list.map(e => e.id));
  toast(message, { undo: () => { S.entries = S.entries.filter(e => !ids.has(e.id)); if (alsoUndo) alsoUndo(); save(); refresh(); toast('Removed.'); } });
}
function removeEntries(ids, message) {
  const gone = new Set(ids);
  const removed = S.entries.filter(e => gone.has(e.id));
  if (!removed.length) return;
  S.entries = S.entries.filter(e => !gone.has(e.id));
  save();
  refresh();
  toast(message, { undo: () => {
    const have = new Set(S.entries.map(e => e.id));
    S.entries.push(...removed.filter(e => !have.has(e.id)));
    save(); refresh();
  } });
}
/* Ask the browser not to clear this site's data when space runs low. Asked once, after the first log. */
function askPersist() {
  if (S.settings.askedPersist) return;
  S.settings.askedPersist = true;
  save();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}

function editEntry(entry) {
  const form = EntryForm({ id: `edit${++seq}`, withDate: true });
  form.set(entry, entry.date);
  const sheet = openSheet({
    title: 'Edit entry',
    onSubmit() {
      const result = form.read(true);
      if (result.error) { form.showError(result.error); return; }
      const current = S.entries.find(e => e.id === entry.id);
      sheet.close();
      if (!current) { toast('That entry is no longer in the log.'); return; }
      Object.assign(current, result.values, { date: result.date });
      save(); refresh(); toast('Saved changes.');
    },
    content: [form.el, h('div', { class: 'actions' },
      h('button', { type: 'submit', class: 'btn btn-primary btn-block' }, 'Save changes'),
      h('button', { type: 'button', class: 'btn btn-danger btn-block', onclick: () => { sheet.close(); removeEntries([entry.id], `Deleted ${entry.exercise}.`); } }, 'Delete entry'))],
  });
}

/* ---------- Log tab ---------- */
const logForm = EntryForm({ id: 'log', recents: true, onChange: queueDraft });
let freeOpen = false;      // the single-exercise form is tucked away until asked for
let draftTimer = 0;
let lastLogAt = 0;

function drawDate() {
  const t = today();
  if (logDate > t) logDate = t;
  const isToday = logDate === t, ago = daysAgo(logDate);
  $('#d-main').textContent = isToday ? 'Today' : fmtDate(logDate);
  $('#d-side').textContent = isToday ? fmtDate(logDate) : ago === 1 ? 'yesterday' : `${ago} days ago`;
  $('#d-pick').classList.toggle('past', !isToday);
  $('#d-next').disabled = isToday;
  const input = $('#d-input');
  input.max = t;
  input.value = logDate;
  $('#log-btn').textContent = isToday ? 'Log entry' : `Log entry ${targetText()}`;
}
function setLogDate(date, auto) {
  logDate = parseYmd(date) && date <= today() ? date : today();
  dateAuto = auto === undefined ? logDate === today() : auto;
  if (session) { session.date = logDate; saveSession(); }
  drawDate(); renderLogged(); saveDraft();
}
function renderLogged() {
  /* During a workout its own entries are in the checklist, so this list shows only what else was logged that day. */
  const inWorkout = new Set(session ? session.items.map(x => x.entryId) : []);
  const list = entriesOn(logDate).filter(e => !inWorkout.has(e.id));
  const title = $('#logged-title');
  title.textContent = `${session ? 'Also logged' : 'Logged'} ${whenText(logDate)}`;
  title.hidden = !!session && !list.length;
  fill($('#logged-list'),
    list.length ? typeGroups(list, editEntry) : !session && h('p', { class: 'muted', text: 'Nothing yet. What you log shows up here.' }),
    list.length > 0 && !session && h('div', { class: 'actions' },
      h('button', { type: 'button', class: 'btn btn-block', onclick: () => routineSheet(null, list.map(toItem)) }, 'Save as routine')));
}
function submitLog(ev) {
  ev.preventDefault();
  if (Date.now() - lastLogAt < 600 && !logForm.dirty()) return;   // second half of a double tap on a form that just cleared
  const result = logForm.read(true);
  if (result.error) { logForm.showError(result.error); return; }
  const entry = { id: uid(), date: logDate, createdAt: Date.now(), ...result.values };
  S.settings.lastType = entry.type;
  const type = S.types.find(t => t.name === entry.type);
  if (type) type.mode = entry.mode;                 // next time this type opens on the fields you used
  logForm.clear();
  saveDraft();
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  $('#log-scroll').scrollTop = 0;
  lastLogAt = Date.now();
  addEntries([entry], `Logged ${entry.exercise}.`);
}

/* The half-filled form survives a reload, which phones do often when you switch apps. */
function queueDraft() { clearTimeout(draftTimer); draftTimer = setTimeout(saveDraft, 250); }
function saveDraft() {
  clearTimeout(draftTimer);
  if (logForm.dirty() || !dateAuto) storage.set(DRAFT_KEY, JSON.stringify({ at: Date.now(), date: logDate, auto: dateAuto, form: logForm.raw() }));
  else storage.remove(DRAFT_KEY);
}
function loadDraft() {
  try {
    const draft = JSON.parse(storage.get(DRAFT_KEY) || 'null');
    if (!draft || !(Date.now() - draft.at < 3 * 3600000)) { storage.remove(DRAFT_KEY); return; }
    if (draft.auto === false && parseYmd(draft.date) && draft.date <= today()) { logDate = draft.date; dateAuto = false; }
    logForm.restore(draft.form);
  } catch (err) { storage.remove(DRAFT_KEY); }
}

/* ---------- Workout in progress ----------
   Pick a routine before you train. The Log tab then lists its exercises,
   and each one is checked off as you log it. */
const SESSION_HOURS = 12;          // a workout left open longer than this closes itself
const STARTERS = [
  ['Push day', [['Bench press', 4, 6], ['Overhead press', 3, 8], ['Incline dumbbell press', 3, 10], ['Lateral raise', 3, 12], ['Triceps pushdown', 3, 12]]],
  ['Pull day', [['Pull-ups', 3, 8], ['Barbell row', 4, 8], ['Lat pulldown', 3, 10], ['Face pull', 3, 15], ['Dumbbell curl', 3, 12]]],
  ['Leg day', [['Squat', 4, 6], ['Romanian deadlift', 3, 8], ['Leg press', 3, 10], ['Leg curl', 3, 12], ['Calf raise', 4, 12]]],
  ['Arm day', [['Barbell curl', 3, 10], ['Close-grip bench press', 3, 8], ['Hammer curl', 3, 12], ['Skull crusher', 3, 10], ['Triceps pushdown', 3, 12]]],
];
let session = loadSession();       // null, or { name, routineId, startedAt, planAt, date, items: [{ item, entryId }] }
const isDone = x => !!x.entryId && S.entries.some(e => e.id === x.entryId);

function loadSession() {
  try {
    const raw = JSON.parse(storage.get(SESSION_KEY) || 'null');
    const live = raw && Array.isArray(raw.items) && Date.now() - raw.startedAt < SESSION_HOURS * 3600000;
    const items = live
      ? raw.items.map(x => ({ item: normItem(x && x.item), entryId: x && typeof x.entryId === 'string' ? x.entryId : null })).filter(x => x.item)
      : [];
    if (!items.length) { storage.remove(SESSION_KEY); return null; }
    return {
      name: cleanText(raw.name, 60) || 'Workout', routineId: cleanText(raw.routineId, 64),
      startedAt: raw.startedAt, planAt: Number(raw.planAt) || 0,
      date: parseYmd(raw.date) ? raw.date : today(), items,
    };
  } catch (err) { storage.remove(SESSION_KEY); return null; }
}
function saveSession() {
  if (session) storage.set(SESSION_KEY, JSON.stringify(session)); else storage.remove(SESSION_KEY);
}
function startWorkout(routine) {
  const before = session;
  session = {
    name: routine.name, routineId: routine.id, startedAt: Date.now(),
    planAt: routine.updatedAt || routine.createdAt || 0, date: logDate,
    items: routine.items.map(item => ({ item: clone(item), entryId: null })),
  };
  saveSession();
  show('log');
  $('#log-scroll').scrollTop = 0;
  toast(`Started ${routine.name}.`, before ? { undo: () => { session = before; saveSession(); refresh(); } } : {});
}
/* The numbers to start an exercise from. What you did last time wins, unless the routine was edited since then.
   Anything the routine leaves blank (a starter has no weights) is filled from last time. Time is never carried over. */
function planFor(row) {
  const item = row.item, last = lastEntry(item.type, item.exercise);
  if (!last || last.mode !== item.mode) return { ...item, notes: '' };
  const newer = last.createdAt > session.planAt;
  const pick = key => (newer || item[key] == null ? last[key] : item[key]);
  return { ...item, weight: pick('weight'), sets: pick('sets'), reps: pick('reps'), distance: pick('distance'), duration: newer ? null : item.duration, notes: '' };
}
function finishWorkout() {
  if (!session) return;
  const before = session;
  const total = before.items.length, done = before.items.filter(isDone).length;
  const rec = done ? recordWorkout(before.routineId, before.name, before.date) : null;     // counts toward "times done"
  if (rec) save();
  session = null;
  saveSession();
  if (dateAuto && logDate !== today()) setLogDate(today(), true);
  refresh();
  toast(done === total ? `Finished ${before.name}. ${count(done, 'exercise')} logged.` : `Ended ${before.name}. ${done} of ${total} logged.`,
    { undo: () => { if (rec) { dropWorkout(rec); save(); } session = before; saveSession(); refresh(); } });
}
function expireSession() {
  if (!session || Date.now() - session.startedAt < SESSION_HOURS * 3600000) return;
  if (session.items.some(isDone)) { recordWorkout(session.routineId, session.name, session.date); save(); }
  session = null;
  saveSession();
  if (dateAuto && logDate !== today()) setLogDate(today(), true);
  refresh();
}

/* The Log tab shows either the free entry form or the workout in progress. */
function renderLogTab() {
  const on = !!session;
  $('#free-log').hidden = on;
  $('#workout').hidden = !on;
  $('#log-form').hidden = !freeOpen;
  $('#free-toggle').textContent = freeOpen ? 'Close single exercise' : 'Log a single exercise';
  $('#log-btn').hidden = on || !freeOpen;
  $('#next-btn').hidden = !on;
  $('#log-bar').hidden = !on && !freeOpen;
  if (on) renderWorkout(); else { renderStarts(); logForm.sync(); }
  renderLogged();
}
/* The workout picker: one big button per routine, with how many times it has been done. */
function renderStarts() {
  fill($('#starts'),
    h('h2', { class: 'sub sub-first', text: 'Start a workout' }),
    S.routines.length
      ? S.routines.map(r => {
          const n = timesDone(r.id), last = lastDone(r.id);
          return h('button', { type: 'button', class: 'start-row', 'aria-label': `Start ${r.name}. Done ${count(n, 'time')}.`, onclick: () => startWorkout(r) },
            h('span', { class: 'start-main' },
              h('span', { class: 'start-name', text: r.name }),
              h('span', { class: 'row-sub', text: `${count(r.items.length, 'exercise')}${last ? `, last done ${whenText(last)}` : ''}` })),
            h('span', { class: 'start-count' }, h('b', { text: String(n) }), h('small', { text: 'done' })));
        })
      : [h('p', { class: 'muted', text: 'No workouts saved yet.' }),
         h('div', { class: 'actions actions-tight' },
           h('button', { type: 'button', class: 'btn btn-primary btn-block', onclick: addStarters }, 'Add starter workouts'),
           h('button', { type: 'button', class: 'btn btn-block', onclick: () => { show('routines'); routineSheet(null); } }, 'Build my own'))]);
}
function renderWorkout() {
  const rows = session.items.map(row => ({ row, entry: (row.entryId && S.entries.find(e => e.id === row.entryId)) || null }));
  const done = rows.filter(r => r.entry).length;
  const next = rows.find(r => !r.entry) || null;
  fill($('#workout'),
    h('div', { class: 'day-head' },
      h('h2', { text: session.name }),
      h('button', { type: 'button', class: 'btn btn-small', onclick: finishWorkout }, 'End workout')),
    h('p', { class: 'muted plan-count', text: `${done} of ${rows.length} done` }),
    rows.map(r => planRow(r.row, r.entry, r === next)),
    h('div', { class: 'actions' }, h('button', { type: 'button', class: 'btn btn-block', onclick: () => logSheet(null) }, 'Add another exercise')));
  $('#next-btn').firstChild.textContent = next ? `Log ${next.row.item.exercise}` : 'Finish workout';
}
function planRow(row, entry, isNext) {
  const shown = entry || planFor(row);
  const m = measures(shown);
  const note = entry ? entry.notes : row.item.notes;
  const planned = describe(shown) === 'no numbers' ? '' : `, planned ${describe(shown)}`;
  return h('button', {
    type: 'button', class: `row plan${entry ? ' done' : isNext ? ' next' : ''}`,
    'aria-label': entry ? `${shown.exercise}, done, ${describe(entry)}. Edit` : `Log ${shown.exercise}${planned}`,
    onclick: () => (entry ? editEntry(entry) : logSheet(row)),
  },
    h('span', { class: 'mark' }, entry && icon('check', 16)),
    h('span', { class: 'row-main' },
      h('span', { class: 'row-name', text: shown.exercise }),
      m.sub && h('span', { class: 'row-sub', text: m.sub }),
      note && h('span', { class: 'row-sub', text: note })),
    h('span', { class: 'row-a', text: m.a }),
    h('span', { class: 'row-b', text: m.b }));
}
/* Log one exercise of the workout, or an extra one when row is null. */
function logSheet(row) {
  const form = EntryForm({ id: `plan${++seq}`, recents: !row, last: !!row, numbersOnly: !!row });
  if (row) form.set(planFor(row));
  const sheet = openSheet({
    title: row ? row.item.exercise : 'Add another exercise',
    onSubmit() {
      const result = form.read(true);
      if (result.error) { form.showError(result.error); return; }
      sheet.close();
      if (!session) return;
      const entry = { id: uid(), date: logDate, createdAt: Date.now(), ...result.values };
      if (row && session.items.includes(row)) row.entryId = entry.id;
      else session.items.push({ item: toItem(entry), entryId: entry.id });
      saveSession();
      S.settings.lastType = entry.type;
      const left = session.items.filter(x => x.entryId !== entry.id && !isDone(x)).length;
      addEntries([entry], left ? `Logged ${entry.exercise}.` : `Logged ${entry.exercise}. That was the last one.`);
    },
    content: [
      row && row.item.notes && h('p', { class: 'muted cue', text: row.item.notes }),
      form.el,
      h('div', { class: 'actions' }, h('button', { type: 'submit', class: 'btn btn-primary btn-block' }, 'Log exercise')),
    ],
  });
}
function addStarters() {
  const type = strengthName();
  const now = Date.now();
  const fresh = STARTERS.filter(([name]) => !S.routines.some(r => sameName(r.name, name))).map(([name, list], i) => ({
    id: uid(), name, createdAt: now + i, updatedAt: now + i,
    items: list.map(([exercise, sets, reps]) => ({ type, mode: 'reps', exercise, weight: null, sets, reps, distance: null, duration: null, notes: '' })),
  }));
  if (!fresh.length) { toast('Those workouts are already in your routines.'); return; }
  S.routines.push(...fresh);
  save(); refresh();
  const ids = new Set(fresh.map(r => r.id));

function moveRoutine(r, dir) {

}
const lastLogged = new Map();

  const now = Date.now();

  const rec = recordWorkout(r.id, r.name, logDate);
  addEntries(r.items.map((item, i) => ({ id: uid(), date: logDate, createdAt: now + i, ...clone(item) })), `Logged ${r.name} ${targetText()}.`, () => dropWorkout(rec));

/* Create or edit a routine. seed is a list of items to start from. */
function routineSheet(routine, seed) {
  const draft = routine ? clone(routine) : { id: uid(), name: '', items: clone(seed || []), createdAt: Date.now() };
  const nameIn = h('input', { id: `routine-name-${++seq}`, class: 'input', type: 'text', maxlength: '60', autocomplete: 'off', autocapitalize: 'words', placeholder: 'Push day' });
  nameIn.value = draft.name;
  nameIn.addEventListener('input', () => { nameIn.removeAttribute('aria-invalid'); nameIn.closest('.field').querySelector('.field-err').textContent = ''; });
  const itemsBox = h('div');
  const itemsErr = h('p', { class: 'field-err', role: 'alert' });
  function moveItem(i, dir) {
    const j = i + dir;
    if (j < 0 || j >= draft.items.length) return;
    [draft.items[i], draft.items[j]] = [draft.items[j], draft.items[i]];
    drawItems();
  }
  function drawItems() {
    itemsErr.textContent = '';
    itemsBox.replaceChildren(...(draft.items.length
      ? draft.items.map((item, i) => h('div', { class: 'item-row' },
          entryRow(item, () => itemSheet(item,
            updated => { draft.items[i] = updated; drawItems(); },
            () => { draft.items.splice(i, 1); drawItems(); })),
          h('button', { type: 'button', class: 'icon-btn move', 'aria-label': `Move ${item.exercise} up`, disabled: i === 0, onclick: () => moveItem(i, -1) }, icon('up')),
          h('button', { type: 'button', class: 'icon-btn move', 'aria-label': `Move ${item.exercise} down`, disabled: i === draft.items.length - 1, onclick: () => moveItem(i, 1) }, icon('down'))))
      : [h('p', { class: 'muted', text: 'No exercises yet.' })]));
  }
  drawItems();
  const sheet = openSheet({
    title: routine ? 'Edit routine' : 'New routine',
    onSubmit() {
      const name = cleanText(nameIn.value, 60);
      if (!name) { fieldError(nameIn, 'Give the routine a name.'); return; }
      if (!draft.items.length) { itemsErr.textContent = 'Add at least one exercise.'; return; }
      draft.name = name;
      draft.updatedAt = Date.now();
      const i = S.routines.findIndex(r => r.id === draft.id);
      if (i >= 0) S.routines[i] = draft; else S.routines.push(draft);
      save(); sheet.close(); refresh();
      toast(routine ? 'Saved changes.' : `Saved ${name} to Routines.`);
    },
    content: [
      field('Routine name', nameIn),
      h('h3', { class: 'sub', text: 'Exercises' }),
      itemsBox, itemsErr,
      h('div', { class: 'actions' },
        h('button', { type: 'button', class: 'btn btn-block', onclick: () => itemSheet(null, item => { draft.items.push(item); drawItems(); }) }, 'Add exercise'),
        h('button', { type: 'submit', class: 'btn btn-primary btn-block' }, 'Save routine'),
        routine && h('button', { type: 'button', class: 'btn btn-danger btn-block', onclick: () => { sheet.close(); deleteRoutine(routine.id); } }, 'Delete routine')),
    ],
  });
  if (!routine) setTimeout(() => nameIn.focus(), 300);
}
function itemSheet(item, onSave, onRemove) {
  const form = EntryForm({ id: `item${++seq}`, recents: true });
  if (item) form.set(item);
  const sheet = openSheet({
    title: item ? 'Edit exercise' : 'Add exercise',

function deleteRoutine(id) {
  const i = S.routines.findIndex(r => r.id === id);
  if (i < 0) return;
  const [removed] = S.routines.splice(i, 1);
  save(); refresh();
  toast(`Deleted ${removed.name}.`, { undo: () => {
    if (!S.routines.some(r => r.id === removed.id)) S.routines.splice(Math.min(i, S.routines.length), 0, removed);

  } });
}

let tableView = false;
let chart = null;
let chartFailed = false;
const RANGE = { day: '14 days', week: '12 weeks', month: '12 months' };
/* Chart colors. Blue is used for the bars and nowhere else in the app. */
const CHART_INK = '#c3c2b7', CHART_GRID = '#2c2c2a', CHART_AXIS = '#383835', CHART_BAR = '#3987e5', CHART_BAR_HOVER = '#6da7ec';

function renderHistory() {

function weekSummary() {
  const start = weekStart(today());
  const list = S.entries.filter(e => e.date >= start);
  const sessions = new Set(list.map(e => e.date)).size;
  const vol = list.reduce((sum, e) => sum + volumeOf(e), 0);

function chartFigure() {

      h('div', { class: 'chart-box', id: 'chart-box' })),
  ];
}
/* Totals per day, week or month, oldest first. */
function buckets(metric, period) {
  const t = today(), out = [];
  let keyOf;
  if (period === 'day') {
    for (let i = 13; i >= 0; i--) { const d = addDays(t, -i); out.push({ key: d, label: shortDate(d), full: fmtDate(d), value: 0 }); }
    keyOf = e => e.date;
  } else if (period === 'week') {
    const start = weekStart(t);
    for (let i = 11; i >= 0; i--) { const d = addDays(start, -7 * i); out.push({ key: d, label: shortDate(d), full: `Week of ${shortDate(d)}`, value: 0 }); }
    keyOf = e => weekStart(e.date);
  } else {
    const now = new Date();
    for (let i = 11; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      out.push({ key: `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`, label: MONTHS[d.getMonth()], full: `${MONTHS[d.getMonth()]} ${d.getFullYear()}`, value: 0 });
    }
    keyOf = e => e.date.slice(0, 7);
  }
  const index = new Map(out.map((b, i) => [b.key, i]));
  const amount = metric === 'volume' ? volumeOf : distOf;
  for (const e of S.entries) { const i = index.get(keyOf(e)); if (i !== undefined) out[i].value += amount(e); }
  for (const b of out) b.value = Math.round(b.value * 100) / 100;
  return out;
}
function killChart() { if (chart) { chart.destroy(); chart = null; } }
function drawChart() {
  const box = $('#chart-box');
  if (!box) return;
  killChart();
  const period = S.settings.period, metric = hasDistance() ? S.settings.metric : 'volume';
  const unit = metric === 'volume' ? 'lb' : 'mi';
  const data = buckets(metric, period);
  const libReady = typeof window.Chart === 'function';
  const toggle = $('#chart-toggle');
  $('#chart-title').textContent = `${metric === 'volume' ? 'Volume' : 'Distance'} per ${period} (${unit})`;
  $('#chart-note').textContent = metric === 'volume' ? 'Weight × sets × reps' : '';
  toggle.hidden = !libReady;

  if (!data.some(b => b.value > 0)) {
    toggle.hidden = true;
    box.className = 'chart-box is-empty';
    box.replaceChildren(h('p', { class: 'muted', text: `No ${metric} logged in the last ${RANGE[period]}.` }));
    return;
  }
  const valueText = v => `${fmtNum(v, metric === 'volume' ? 0 : 2)} ${unit}`;
  if (tableView || !libReady) {
    box.className = 'chart-box is-table';
    fill(box,
      !libReady && chartFailed && h('p', { class: 'muted chart-offline', text: 'The chart needs an internet connection to load. Here are the same numbers.' }),
      h('table', { class: 'data-table' },
        h('thead', null, h('tr', null, h('th', { scope: 'col', text: period === 'day' ? 'Day' : period === 'week' ? 'Week of' : 'Month' }), h('th', { scope: 'col', class: 'r', text: metric === 'volume' ? 'Volume' : 'Distance' }))),
        h('tbody', null, data.slice().reverse().map(b => h('tr', null, h('td', { text: period === 'week' ? b.label : b.full }), h('td', { class: 'r', text: valueText(b.value) }))))));
    return;
  }

  const canvas = h('canvas', { role: 'img', 'aria-label': `Bar chart of ${metric} per ${period}. The Table button shows the same numbers.` });
  box.className = 'chart-box';
  box.replaceChildren(canvas);
  const peak = Math.max(...data.map(b => b.value));
  const font = { family: getComputedStyle(document.body).fontFamily, size: 12 };
  chart = new window.Chart(canvas, {
    type: 'bar',
    data: {
      labels: data.map(b => b.label),
      datasets: [{
        data: data.map(b => b.value),
        backgroundColor: CHART_BAR, hoverBackgroundColor: CHART_BAR_HOVER,
        borderRadius: { topLeft: 4, topRight: 4 }, borderSkipped: false,
        maxBarThickness: 24, categoryPercentage: 0.9, barPercentage: 0.8,
      }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      animation: REDUCED_MOTION ? false : { duration: 250 },
      interaction: { mode: 'index', intersect: false },      // the whole column is the touch target, not just the bar
      layout: { padding: { top: 6 } },
      scales: {
        x: { grid: { display: false }, border: { color: CHART_AXIS }, ticks: { color: CHART_INK, font, maxRotation: 0, autoSkipPadding: 10 } },
        y: {
          beginAtZero: true, border: { display: false }, grid: { color: CHART_GRID, drawTicks: false },
          ticks: { color: CHART_INK, font, padding: 8, maxTicksLimit: 5, callback: v => v === 0 ? '0' : peak >= 10000 ? `${fmtNum(v / 1000, 1)}K` : fmtNum(v) },
        },
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          displayColors: false, backgroundColor: '#fff', titleColor: '#000', bodyColor: '#333',
          titleFont: { family: font.family, size: 17, weight: '700' }, bodyFont: { family: font.family, size: 13 },
          padding: 10, cornerRadius: 8, caretSize: 6,
          callbacks: { title: items => valueText(items[0].parsed.y), label: item => data[item.dataIndex].full },
        },
      },
    },
  });
}

function removeType(name) {

  if (S.settings.lastType === name) S.settings.lastType = S.types[0].name;
  save(); afterDataChange();
  toast(`Removed ${name}. Past entries keep it.`, { undo: () => {
    if (!S.types.some(t => sameName(t.name, removed.name))) S.types.splice(Math.min(i, S.types.length), 0, removed);

function exportBackup() {
  const payload = { app: 'workout-log', version: 1, exportedAt: new Date().toISOString(), entries: S.entries, routines: S.routines, workouts: S.workouts, types: S.types, settings: S.settings };
  const json = JSON.stringify(payload, null, 2);
  const name = `workout-log-${today()}.json`;
  const done = () => { S.settings.lastBackup = Date.now(); save(); if (active === 'settings') renderSettings(); toast('Backup exported.', { force: true }); };
  const download = () => {
    const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
    const link = h('a', { href: url, download: name });
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
    done();
  };
  /* On iPhone the share sheet (Save to Files, AirDrop, Mail) is more dependable than a download, especially from the Home Screen. */
  const iOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let file;
  try { file = new File([json], name, { type: 'application/json' }); } catch (err) { file = null; }
  if (iOS && file && navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file] }).then(done, err => { if (!err || err.name !== 'AbortError') download(); });
    return;
  }
  download();
}
function importBackup(file) {
  const reader = new FileReader();
  reader.onerror = () => toast('Could not read that file.');
  reader.onload = () => {
    let raw;
    try { raw = JSON.parse(String(reader.result)); } catch (err) { toast('That file is not a Workout Log backup.'); return; }
    const incoming = normState(raw);
    if (!incoming.entries.length && !incoming.routines.length) { toast('No workouts found in that file.'); return; }
    if (!S.entries.length && !S.routines.length) { applyImport(incoming, true); return; }
    const sheet = openSheet({
      title: 'Import backup',
      content: h('div', { class: 'stack' },
        h('p', { text: `This backup has ${count(incoming.entries.length, 'entry', 'entries')} and ${count(incoming.routines.length, 'routine')}. This device has ${count(S.entries.length, 'entry', 'entries')} and ${count(S.routines.length, 'routine')}.` }),
        h('button', { type: 'button', class: 'btn btn-block btn-primary', onclick: () => { sheet.close(); applyImport(incoming, false); } }, 'Add to what is here'),
        h('button', { type: 'button', class: 'btn btn-block btn-danger', onclick: () => { sheet.close(); applyImport(incoming, true); } }, 'Replace what is here')),
    });
  };
  reader.readAsText(file);
}
function applyImport(incoming, replace) {
  const before = clone(S);
  let message;
  if (replace) {
    S = incoming;
    session = null; saveSession();
    message = `Imported ${count(S.entries.length, 'entry', 'entries')} and ${count(S.routines.length, 'routine')}.`;
  } else {
    const have = new Set([...S.entries, ...S.routines, ...S.workouts].map(x => x.id));
    S.workouts.push(...incoming.workouts.filter(w => !have.has(w.id)));
    const entries = incoming.entries.filter(e => !have.has(e.id));
    const routines = incoming.routines.filter(r => !have.has(r.id));
    S.entries.push(...entries);
    S.routines.push(...routines);
    for (const t of incoming.types) if (!S.types.some(x => sameName(x.name, t.name))) S.types.push(t);
    const skipped = incoming.entries.length - entries.length;
    message = `Added ${count(entries.length, 'entry', 'entries')} and ${count(routines.length, 'routine')}.${skipped ? ` ${count(skipped, 'entry was', 'entries were')} already here.` : ''}`;
  }
  save(); afterDataChange();
  toast(message, { undo: () => { S = before; save(); afterDataChange(); } });
}
function deleteAllSheet() {
  const sheet = openSheet({
    title: 'Delete all data?',
    content: h('div', { class: 'stack' },
      h('p', { text: `This removes ${count(S.entries.length, 'entry', 'entries')} and ${count(S.routines.length, 'routine')} from this device. Export a backup first if you might want them back.` }),
      h('button', { type: 'button', class: 'btn btn-block btn-danger', onclick: () => {
        sheet.close();
        const before = clone(S);
        S = normState(null);
        session = null; saveSession();
        save(); afterDataChange();
        toast('Deleted all data.', { undo: () => { S = before; save(); afterDataChange(); } });
      } }, 'Delete everything'),
      h('button', { type: 'button', class: 'btn btn-block', onclick: () => sheet.close() }, 'Keep my data')),
  });
}

/* ---------- Tabs ---------- */
function refresh() {
  if (active === 'log') { drawDate(); renderLogTab(); }
  else if (active === 'routines') renderRoutines();
  else if (active === 'history') renderHistory();
  else renderSettings();
}
/* After an import, a reset or a change to types or presets: everything on screen may be stale. */
function afterDataChange() { Timer.drawPresets(); Timer.render(true); logForm.sync(); refresh(); }
function show(tab) {
  active = tab;
  for (const name of ['log', 'routines', 'history', 'settings']) $(`#view-${name}`).hidden = name !== tab;
  for (const btn of $('#tabs').children) {
    if (btn.dataset.tab === tab) btn.setAttribute('aria-current', 'page'); else btn.removeAttribute('aria-current');
  }
  refresh();
}

/* ---------- Rest timer ---------- */
const Timer = (() => {
  const bar = $('#timer'), big = $('#bigtimer');
  const idle = () => ({ status: 'idle', duration: 0, endAt: 0, left: 0, round: 1, doneAt: 0, flashUntil: 0 });
  let st = idle();
  let ticker = 0, lastPip = 0, lastKey = '', audio = null, wake = null, bigOpener = null;

  /* Seven-segment digits, built once from seven polygons each. */
  const SEG_POINTS = (() => {
    const W = 56, H = 100, T = 13, G = 1.6, mid = H / 2;
    const flat = cy => { const a = T / 2 + G, b = W - T / 2 - G; return [[a, cy], [a + T / 2, cy - T / 2], [b - T / 2, cy - T / 2], [b, cy], [b - T / 2, cy + T / 2], [a + T / 2, cy + T / 2]]; };
    const tall = (cx, y1, y2) => [[cx, y1], [cx + T / 2, y1 + T / 2], [cx + T / 2, y2 - T / 2], [cx, y2], [cx - T / 2, y2 - T / 2], [cx - T / 2, y1 + T / 2]];
    const shapes = {
      a: flat(T / 2), g: flat(mid), d: flat(H - T / 2),
      f: tall(T / 2, T / 2 + G, mid - G), b: tall(W - T / 2, T / 2 + G, mid - G),
      e: tall(T / 2, mid + G, H - T / 2 - G), c: tall(W - T / 2, mid + G, H - T / 2 - G),
    };
    const out = {};
    for (const key in shapes) out[key] = shapes[key].map(pt => pt.map(n => +n.toFixed(1)).join(',')).join(' ');
    return out;
  })();
  const SEG_ON = ['abcdef', 'bc', 'abdeg', 'abcdg', 'bcfg', 'acdfg', 'acdefg', 'abc', 'abcdefg', 'abcdfg'];

  function segDisplay() {
    const digit = () => {
      const el = sv('svg', { class: 'd', viewBox: '0 0 56 100', 'aria-hidden': 'true' });
      for (const key in SEG_POINTS) el.append(sv('polygon', { points: SEG_POINTS[key], 'data-s': key }));
      return el;
    };
    const colon = sv('svg', { class: 'c', viewBox: '0 0 20 100', 'aria-hidden': 'true' },
      sv('rect', { class: 'on', x: 3.5, y: 27, width: 13, height: 13, rx: 2 }),
      sv('rect', { class: 'on', x: 3.5, y: 60, width: 13, height: 13, rx: 2 }));
    const d = [digit(), digit(), digit(), digit()];
    const el = h('span', { class: 'seg', role: 'timer' }, d[0], d[1], colon, d[2], d[3]);
    let shown = -1;
    const put = (node, n) => { for (const part of node.children) part.classList.toggle('on', SEG_ON[n].includes(part.dataset.s)); };
    function set(total) {
      total = Math.max(0, Math.min(Math.round(total), 5999));
      if (total === shown) return;
      shown = total;
      const m = Math.floor(total / 60), s = total % 60;
      d[0].style.display = m >= 10 ? '' : 'none';
      el.style.setProperty('--cells', m >= 10 ? '2.72' : '2.12');
      put(d[0], Math.floor(m / 10)); put(d[1], m % 10); put(d[2], Math.floor(s / 10)); put(d[3], s % 10);
      el.setAttribute('aria-label', `${m} min ${s} sec`);
    }
    return { el, set };
  }
  const small = segDisplay(), large = segDisplay();

  const presetLabel = sec => sec < 120 ? `${sec}s` : sec % 60 === 0 ? `${sec / 60}m` : fmtDur(sec);
  function drawPresets() {
    for (const box of [$('#t-presets'), $('#b-presets')]) {
      box.replaceChildren(...S.settings.presets.map(sec => h('button', {
        type: 'button', class: 't-btn', 'aria-label': `Start a ${fmtDur(sec)} timer`, onclick: () => start(sec),
      }, presetLabel(sec))));
    }
  }

  /* --- Sound, vibration, screen wake lock --- */
  function unlockAudio() {
    if (!S.settings.sound) return;
    try {
      if (!audio) { const Ctx = window.AudioContext || window.webkitAudioContext; if (!Ctx) return; audio = new Ctx(); }
      if (audio.state !== 'running') { const p = audio.resume(); if (p && p.catch) p.catch(() => {}); }
    } catch (err) { audio = null; }
  }
  function beep(notes, volume) {
    if (!S.settings.sound || !audio) return;
    const play = () => {
      try {
        const t0 = audio.currentTime + 0.03;
        for (const [freq, at, len] of notes) {
          const osc = audio.createOscillator(), gain = audio.createGain();
          const a = t0 + at, b = a + len;
          osc.type = 'triangle';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.0001, a);
          gain.gain.exponentialRampToValueAtTime(volume, a + 0.012);
          gain.gain.setValueAtTime(volume, Math.max(a + 0.013, b - 0.04));
          gain.gain.exponentialRampToValueAtTime(0.0001, b);
          osc.connect(gain);
          gain.connect(audio.destination);
          osc.start(a);
          osc.stop(b + 0.02);
        }
      } catch (err) { /* sound is a bonus, the visual alert still runs */ }
    };
    if (audio.state === 'running') { play(); return; }
    /* The phone has suspended audio. Play only if it wakes right away, never late on some later tap. */
    const asked = Date.now();
    try {
      const p = audio.resume();
      if (p && p.then) p.then(() => { if (Date.now() - asked < 500) play(); }, () => {});
    } catch (err) { /* stays silent */ }
  }
  const SOUND_PIP = [[1175, 0, 0.09]];
  const SOUND_ROUND = [[1568, 0, 0.45]];
  const SOUND_DONE = [[1568, 0, 0.14], [1568, 0.2, 0.14], [1568, 0.4, 0.14], [2093, 0.6, 0.6]];

  async function wakeOn() {
    if (!S.settings.wake || !('wakeLock' in navigator) || wake || document.hidden) return;
    try {
      const lock = await navigator.wakeLock.request('screen');
      const wanted = st.status === 'running' || st.status === 'done';
      if (!wanted || wake) { lock.release().catch(() => {}); return; }     // stopped meanwhile, or another request got there first
      wake = lock;
      lock.addEventListener('release', () => { if (wake === lock) wake = null; });
    } catch (err) { /* not allowed right now, the timer works without it */ }
  }
  function wakeOff() {
    if (!wake) return;
    const lock = wake;
    wake = null;
    lock.release().catch(() => {});
  }

  const persist = () => { if (st.status === 'idle') storage.remove(TIMER_KEY); else storage.set(TIMER_KEY, JSON.stringify(st)); };
  function run() { if (!ticker) ticker = setInterval(tick, 200); }
  function start(sec) {
    unlockAudio();
    st = { ...idle(), status: 'running', duration: sec, endAt: Date.now() + sec * 1000 };
    lastPip = 0;
    beep([[880, 0, 0.05]], 0.25);
    run(); wakeOn(); persist(); render();
  }
  function toggle() {
    unlockAudio();
    const now = Date.now();
    if (st.status === 'running') { st.left = Math.max(0, st.endAt - now); st.status = 'paused'; wakeOff(); }
    else if (st.status === 'paused') { st.endAt = now + st.left; st.status = 'running'; wakeOn(); }
    else return;
    persist(); render();
  }
  function add(sec) {
    if (st.status === 'running') st.endAt += sec * 1000;
    else if (st.status === 'paused') st.left += sec * 1000;

    st.duration += sec;
    lastPip = 0;
    persist(); render();

  function stop() {

    clearInterval(ticker); ticker = 0;
    wakeOff(); persist(); render();
  }
  function toggleRepeat() {
    S.settings.repeat = !S.settings.repeat;
    save(); render(true);
    if (big.hidden) toast(S.settings.repeat ? 'Repeat on. The timer restarts itself after each round.' : 'Repeat off.');
  }
  function tick() {
    const now = Date.now();
    if (st.status === 'running') {
      const ms = st.endAt - now;
      if (ms <= 0) {
        const onTime = ms > -2500;                   // if the phone was asleep, skip the sound and just show the state
        if (S.settings.repeat) {
          while (st.endAt <= now) { st.endAt += st.duration * 1000; st.round += 1; }
          lastPip = 0;
          if (onTime) { st.flashUntil = now + 900; beep(SOUND_ROUND, 0.7); buzz(300); }
        } else {
          st.status = 'done';
          st.doneAt = st.endAt;
          if (onTime) { beep(SOUND_DONE, 0.7); buzz([250, 120, 250, 120, 500]); }
          announce('Rest timer finished.');
        }
        persist();
      } else {
        const sec = Math.ceil(ms / 1000);
        if (sec <= 3 && sec !== lastPip && st.duration >= 10) { lastPip = sec; beep(SOUND_PIP, 0.5); }
      }
    } else if (st.status === 'done') {
      const over = now - st.doneAt;
      if (over > 10 * 60000) { stop(); return; }
      if (over > 60000) wakeOff();
    }
    render();
  }

  /* --- Drawing --- */
  function render(force) {
    const now = Date.now();
    let shown = 0, frac = 0, invert = false;
    if (st.status === 'running') {
      const ms = Math.max(0, st.endAt - now);
      shown = Math.ceil(ms / 1000); frac = ms / (st.duration * 1000); invert = now < st.flashUntil;
    } else if (st.status === 'paused') {
      shown = Math.ceil(st.left / 1000); frac = st.left / (st.duration * 1000);
    } else if (st.status === 'done') {
      const over = Math.max(0, now - st.doneAt);
      shown = Math.floor(over / 1000);                // counts up, so you can see how long you have been over
      invert = REDUCED_MOTION || over > 6000 || Math.floor(over / 450) % 2 === 0;   // blink for six seconds, then stay lit
    }
    small.set(shown); large.set(shown);
    const scale = `scaleX(${Math.min(1, Math.max(0, frac)).toFixed(4)})`;
    $('#t-bar').style.transform = scale;
    $('#b-bar').style.transform = scale;
    for (const root of [bar, big]) { root.dataset.state = st.status; root.toggleAttribute('data-invert', invert); }
    const key = `${st.status}|${st.round}|${S.settings.repeat}`;
    if (force || key !== lastKey) { lastKey = key; drawControls(); }
  }
  function drawControls() {
    const running = st.status === 'running', paused = st.status === 'paused', done = st.status === 'done', repeat = S.settings.repeat;
    const tog = $('#t-toggle');
    tog.replaceChildren(icon(paused ? 'play' : 'pause', 22));
    tog.setAttribute('aria-label', paused ? 'Resume timer' : 'Pause timer');
    $('#t-stop').setAttribute('aria-label', done ? 'Dismiss timer' : 'Stop timer');
    $('#t-repeat').setAttribute('aria-pressed', String(repeat));
    const round = $('#t-round');
    round.hidden = !(repeat && (running || paused));
    round.textContent = `Round ${st.round}`;
    $('#b-toggle').textContent = paused ? 'Resume' : 'Pause';
    $('#b-toggle').disabled = !(running || paused);
    $('#b-add').disabled = !(running || paused);
    $('#b-stop').textContent = done ? 'Dismiss' : 'Stop';
    $('#b-stop').disabled = st.status === 'idle';
    $('#b-repeat').setAttribute('aria-checked', String(repeat));
    $('#b-label').textContent = done ? 'Time’s up' : paused ? 'Paused' : running ? (repeat ? `Round ${st.round}` : 'Rest') : 'Pick a time';
  }

  function openBig() {
    bigOpener = document.activeElement;
    big.hidden = false;
    syncInert();
    $('#b-close').focus({ preventScroll: true });
    render(true);
  }
  function closeBig() {
    if (big.hidden) return;
    big.hidden = true;
    syncInert();
    if (bigOpener && bigOpener.isConnected) bigOpener.focus({ preventScroll: true });
  }

  /* Pick up a timer that was running before a reload. */
  function restore() {
    let saved;
    try { saved = JSON.parse(storage.get(TIMER_KEY) || 'null'); } catch (err) { saved = null; }
    if (!saved || !['running', 'paused', 'done'].includes(saved.status) || !(saved.duration > 0)) { storage.remove(TIMER_KEY); return; }
    const now = Date.now();
    st = { ...idle(), status: saved.status, duration: Number(saved.duration), endAt: Number(saved.endAt) || 0, left: Number(saved.left) || 0, round: Number(saved.round) || 1, doneAt: Number(saved.doneAt) || 0 };
    const sane = st.status === 'paused' ? st.left > 0 && st.left <= st.duration * 1000
      : st.status === 'running' ? st.endAt - now <= st.duration * 1000 + 1000
      : st.doneAt <= now && now - st.doneAt < 10 * 60000;
    if (!sane) { st = idle(); storage.remove(TIMER_KEY); return; }
    run();
    tick();
    if (st.status === 'running') wakeOn();
  }

  function setup() {
    $('#t-open').append(icon('watch', 26), small.el);
    $('#b-seg').append(large.el);
    $('#t-repeat').append(icon('repeat', 22));
    $('#t-stop').append(icon('x', 22));
    $('#b-close').append(icon('x', 30));
    $('#t-open').addEventListener('click', openBig);
    $('#b-close').addEventListener('click', closeBig);
    for (const id of ['#t-add', '#b-add']) $(id).addEventListener('click', () => add(15));
    for (const id of ['#t-toggle', '#b-toggle']) $(id).addEventListener('click', toggle);
    for (const id of ['#t-stop', '#b-stop']) $(id).addEventListener('click', stop);
    for (const id of ['#t-repeat', '#b-repeat']) $(id).addEventListener('click', toggleRepeat);
    drawPresets();
    restore();
    render(true);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden || st.status === 'idle') return;
      tick();
      if (st.status === 'running') wakeOn();
    });

    document.addEventListener('pointerdown', () => { if (audio && audio.state !== 'running') unlockAudio(); }, { passive: true });
  }
  function test() { unlockAudio(); beep(SOUND_DONE, 0.7); }

  return { setup, drawPresets, render, closeBig, test };
})();

/* ---------- Startup ---------- */
function init() {
  /* Tabs */
  for (const btn of $('#tabs').children) {
    btn.prepend(icon(btn.dataset.tab, 24));
    btn.addEventListener('click', () => show(btn.dataset.tab));
  }

  /* Log tab */
  $('#log-form').append(logForm.el);
  $('#log-form').addEventListener('submit', submitLog);
  $('#d-prev').append(icon('prev'));
  $('#d-next').append(icon('next'));
  $('#d-prev').addEventListener('click', () => setLogDate(addDays(logDate, -1)));
  $('#d-next').addEventListener('click', () => setLogDate(addDays(logDate, 1)));
  const dateInput = $('#d-input');
  const onDate = () => setLogDate(dateInput.value || today());
  dateInput.addEventListener('change', onDate);
  dateInput.addEventListener('input', onDate);
  dateInput.addEventListener('click', () => {
    /* Phones open their date picker on tap. A desktop browser needs to be asked. */
    if (dateInput.showPicker && matchMedia('(pointer: fine)').matches) { try { dateInput.showPicker(); } catch (err) { /* already open */ } }
  });
  loadDraft();
  freeOpen = logForm.dirty();                                          // a half-typed entry reopens its form
  $('#free-toggle').addEventListener('click', () => { freeOpen = !freeOpen; renderLogTab(); });
  if (session && session.date <= today()) logDate = session.date;      // a workout in progress keeps its day
  $('#next-btn').addEventListener('click', () => {
    const next = session && session.items.find(x => !isDone(x));
    if (next) logSheet(next); else finishWorkout();
  });

  /* Backup import */
  const fileInput = $('#import-file');
  fileInput.addEventListener('change', () => {
    const file = fileInput.files && fileInput.files[0];
    fileInput.value = '';
    if (file) importBackup(file);
  });

  /* Chart.js arrives after this script. Redraw History when it loads or fails. */
  const lib = $('#chartjs');
  if (lib) {
    lib.addEventListener('load', () => { if (active === 'history') drawChart(); });
    lib.addEventListener('error', () => { chartFailed = true; if (active === 'history') drawChart(); });
  }

  Timer.setup();
  show('log');
  if (!storage.ok) toast('Storage is blocked in this browser, so nothing will be saved.');

  /* Escape closes the top sheet or the full-screen timer. */
  document.addEventListener('keydown', ev => {
    if (ev.key !== 'Escape') return;
    if (sheets.length) sheets[sheets.length - 1].close(); else Timer.closeBig();
  });
  /* After midnight, move the Log tab to the new day unless you picked a date yourself, and redraw labels like Today and Yesterday. */
  let dayShown = today();
  const rollOver = () => {
    const t = today();
    if (t === dayShown) return;
    dayShown = t;
    if (dateAuto && !session) setLogDate(t, true);        // a workout that runs past midnight stays on the day it started
    refresh();
  };
  const everyMinute = () => { expireSession(); rollOver(); };
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveDraft(); else everyMinute(); });
  window.addEventListener('pagehide', saveDraft);
  setInterval(everyMinute, 60000);

  window.addEventListener('storage', ev => {
    if (ev.key === KEY) { S = load(); afterDataChange(); }

  });

  document.addEventListener('focusout', () => setTimeout(() => {
    const el = document.activeElement;
    if (!el || el.tagName !== 'INPUT') window.scrollTo(0, 0);
  }, 120));
}
init();
})();
