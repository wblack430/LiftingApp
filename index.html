/* ---------- Tokens ---------- */
:root {
  color-scheme: dark;
  --bg: #000;            /* page */
  --raised: #161616;     /* sheets */
  --pressed: #2a2a2a;    /* pressed state */
  --rule: #383838;       /* row dividers */
  --outline: #6f6f6f;    /* control outlines, 4:1 on black */
  --ink: #fff;           /* text and primary actions */
  --ink-2: #c9c9c9;      /* secondary text */
  --ink-3: #9a9a9a;      /* placeholders */
  --clock: #ffb300;      /* the rest timer, nothing else */
  --danger: #ff6b6b;     /* destructive actions and errors */
  --ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --num: "Barlow Condensed", "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --pad: 16px;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  height: 100%; margin: 0; overflow: hidden;
  background: var(--bg); color: var(--ink);
  font: 400 17px/1.4 var(--ui);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none; user-select: none;
  touch-action: manipulation;
  overscroll-behavior: none;
}
h1, h2, h3, p, figure { margin: 0; }
button, input { font: inherit; color: inherit; margin: 0; }
button {
  -webkit-appearance: none; appearance: none;
  padding: 0; border: 0; border-radius: 0; background: none;
  cursor: pointer; touch-action: manipulation;
}
input { -webkit-user-select: text; user-select: text; }
[hidden] { display: none !important; }
:focus { outline: none; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ---------- App shell: timer bar, scrolling view, tab bar ---------- */
#app {
  display: flex; flex-direction: column;
  height: 100vh; height: 100dvh;
  max-width: 560px; margin: 0 auto;
  padding: 0 var(--safe-r) 0 var(--safe-l);
}
#views { position: relative; flex: 1 1 auto; min-height: 0; }
.view { position: absolute; inset: 0; display: flex; flex-direction: column; }
.scroll {
  flex: 1 1 auto; min-height: 0;
  overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  padding: 12px var(--pad) 36px;
}
.actionbar { flex: none; padding: 10px var(--pad) 12px; border-top: 1px solid var(--rule); background: var(--bg); }

#tabs { flex: none; display: flex; padding-bottom: var(--safe-b); border-top: 1px solid var(--rule); background: var(--bg); }
#tabs button {
  position: relative; flex: 1 1 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  height: 58px; color: var(--ink-3);
  font: 500 12px/1 var(--ui);
}
#tabs button[aria-current="page"] { color: var(--ink); }
#tabs button[aria-current="page"]::before {
  content: ""; position: absolute; top: -1px; left: 24%; right: 24%;
  height: 3px; border-radius: 0 0 3px 3px; background: var(--ink);
}
#tabs button:focus-visible { outline-offset: -4px; }

/* ---------- Type ---------- */
.title { margin: 6px 0 14px; font: 600 36px/1.05 var(--num); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 6px 0 14px; }
.title-row .title { margin: 0; }
.sub { margin: 28px 0 10px; font: 600 24px/1.15 var(--num); }
.muted { color: var(--ink-2); font-size: 15px; line-height: 1.45; }
.muted + .muted { margin-top: 8px; }
.sub-first { margin-top: 0; }
.sub + .day { margin-top: 0; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; padding: 0 18px;
  border: 2px solid var(--outline); border-radius: 12px;
  color: var(--ink); font: 600 21px/1.05 var(--num); text-align: center;
}
.btn:active { background: var(--pressed); }
.btn-primary { min-height: 58px; border-color: var(--ink); background: var(--ink); color: #000; font-size: 24px; }
.btn-primary:active { border-color: #c9c9c9; background: #c9c9c9; }
.btn-danger { border-color: var(--danger); color: var(--danger); }
.btn-small { min-height: 44px; padding: 0 14px; font-size: 19px; }
.btn-block { display: flex; width: 100%; }
.btn[disabled] { opacity: .4; }
.icon-btn {
  flex: none; display: inline-flex; align-items: center; justify-content: center;
  width: 48px; height: 48px; border-radius: 12px; color: var(--ink);
}
.icon-btn:active { background: var(--pressed); }
.icon-btn[disabled] { opacity: .3; }
.stack { display: grid; gap: 10px; }
.actions { display: grid; gap: 10px; margin-top: 20px; }
.actions-tight { margin-top: 14px; }

/* ---------- Form controls ---------- */
.form { display: grid; gap: 14px; }
.block { display: grid; gap: 14px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field { min-width: 0; }
.field > label { display: block; margin-bottom: 6px; color: var(--ink-2); font-size: 15px; line-height: 1.2; }
.field-err { margin-top: 6px; color: var(--danger); font-size: 15px; line-height: 1.3; }
.field-err:empty { display: none; }
.input {
  display: block; width: 100%; min-width: 0; height: 56px; padding: 0 14px;
  border: 2px solid var(--outline); border-radius: 12px;
  background: #000; color: var(--ink);
  font: 400 18px/1.2 var(--ui);
  -webkit-appearance: none; appearance: none;
}
.input::placeholder { color: var(--ink-3); opacity: 1; }
.input:focus, .input:focus-visible { outline: none; border-color: var(--ink); }
.input[aria-invalid="true"] { border-color: var(--danger); }
input[type="date"].input, input[type="time"].input { text-align: left; }
input[type="date"].input::-webkit-date-and-time-value, input[type="time"].input::-webkit-date-and-time-value { text-align: left; }
.num-input { padding: 0 4px; text-align: center; font: 600 28px/1 var(--num); font-variant-numeric: tabular-nums; }
.stepper { display: flex; gap: 6px; }
.stepper .num-input { flex: 1 1 0; }
.step {
  flex: none; width: 48px; height: 56px;
  border: 2px solid var(--outline); border-radius: 12px;
  color: var(--ink); font: 600 30px/1 var(--num);
}
.step:active { background: var(--pressed); }

.type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.chip {
  min-height: 46px; padding: 0 12px;
  border: 2px solid var(--outline); border-radius: 999px;
  color: var(--ink); font: 600 19px/1.05 var(--num);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.chip:active { background: var(--pressed); }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: #000; }
.type-grid .chip { padding: 4px 10px; white-space: normal; overflow: visible; overflow-wrap: anywhere; }

.seg2 { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 2px solid var(--outline); border-radius: 12px; overflow: hidden; }
.seg2 button { min-height: 42px; padding: 0 10px; color: var(--ink-2); font: 600 18px/1 var(--num); }
.seg2 button + button { border-left: 2px solid var(--outline); }
.seg2 button[aria-pressed="true"] { background: var(--ink); color: #000; }
.seg2 button:focus-visible { outline-offset: -4px; }

.recents {
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
  margin: 8px calc(var(--pad) * -1) 0; padding: 0 var(--pad);
}
.recents::-webkit-scrollbar { display: none; }
.recents:empty { display: none; }
.recents .chip { flex: none; min-height: 42px; max-width: 240px; font-size: 18px; }
/* ---------- Start tab: one big button, then the saved workouts to pick from ---------- */
.start-home { display: flex; flex-direction: column; }
.start-mid { flex: 1 0 auto; display: flex; flex-direction: column; justify-content: center; gap: 12px; padding-bottom: 24px; }
.btn-start { min-height: 132px; border-radius: 18px; font-size: 56px; }
.start-now { font: 600 34px/1.1 var(--num); overflow-wrap: anywhere; }
.start-mid .muted { margin: -6px 0 8px; }
.start-note { margin-bottom: 12px; }
.start-list { display: grid; gap: 10px; }
.start-row {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  width: 100%; min-height: 78px; padding: 10px 16px;
  border: 2px solid var(--outline); border-radius: 14px; color: var(--ink); text-align: left;
}
.start-row:active { background: var(--pressed); }
.start-main { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.start-name { font: 600 26px/1.1 var(--num); overflow-wrap: anywhere; }
.start-count {
  flex: none; align-self: stretch;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  width: 88px; padding-left: 14px; border-left: 1px solid var(--rule);
}
.start-count b { font: 600 34px/1 var(--num); font-variant-numeric: tabular-nums; }
.start-count small { color: var(--ink-2); font-size: 13px; line-height: 1.1; white-space: nowrap; }
#log-form { margin-top: 14px; }
/* Exercise rows with move buttons, in the routine editor */
.item-row { display: flex; align-items: center; gap: 2px; border-bottom: 1px solid var(--rule); }
.item-row .row { flex: 1 1 0; min-width: 0; border-bottom: 0; }
.item-row .row-a, .item-row .row-b { min-width: 0; }
.move { width: 40px; height: 48px; }
.head-tools { flex: none; display: flex; gap: 2px; }
.hint { margin-top: 8px; color: var(--ink-2); font-size: 15px; line-height: 1.35; }
[hidden] + .field-err + [hidden] + .hint { margin-top: 0; }
.hint:empty { display: none; }

/* ---------- Log tab ---------- */
.date-row { display: flex; align-items: center; gap: 4px; margin-bottom: 12px; }
.date-pick {
  position: relative; flex: 1 1 auto; min-width: 0;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 48px; padding: 6px 12px; border-radius: 12px;
}
.date-pick input {
  position: absolute; inset: 0; width: 100%; height: 100%;
  padding: 0; border: 0; opacity: 0; cursor: pointer;
  -webkit-appearance: none; appearance: none;
}
.date-pick:focus-within { outline: 3px solid var(--ink); outline-offset: 2px; }
.date-main { font: 600 26px/1 var(--num); white-space: nowrap; }
.date-side { color: var(--ink-2); font-size: 15px; line-height: 1; white-space: nowrap; }
.date-pick.past { background: var(--ink); }
.date-pick.past .date-main { color: #000; }
.date-pick.past .date-side { color: #2e2e2e; }

/* ---------- Logbook rows (Log, Routines, History) ---------- */
.day { margin-top: 26px; }
.day-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 48px; border-bottom: 2px solid var(--ink); }
.day-head h2, .day-head h3 { font: 600 24px/1.1 var(--num); overflow-wrap: anywhere; }
.type-head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  padding: 14px 0 4px; color: var(--ink-2); font: 600 15px/1.2 var(--ui);
}
.type-head .tot { font: 600 17px/1 var(--num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto auto; column-gap: 14px; align-items: center;
  width: 100%; min-height: 56px; padding: 9px 0;
  border-bottom: 1px solid var(--rule);
  color: var(--ink); text-align: left;
}
button.row:active { background: var(--pressed); }
button.row:focus-visible { outline-offset: -3px; }
.row-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.row-name { font-size: 17px; line-height: 1.25; overflow-wrap: anywhere; }
.row-sub { color: var(--ink-2); font-size: 14px; line-height: 1.3; overflow-wrap: anywhere; }
.row-a, .row-b { font: 600 21px/1 var(--num); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.row-a { min-width: 70px; }
.row-b { min-width: 58px; }

/* Workout in progress: the same rows with a check mark in front */
.plan-count { margin: 10px 0 2px; }
.row.plan { grid-template-columns: 26px minmax(0, 1fr) auto auto; column-gap: 12px; }
.mark { display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; border: 2px solid var(--outline); border-radius: 50%; }
.plan.next .mark { border-color: var(--ink); }
.plan.next .row-name { font-weight: 600; }
.plan.done .mark { border-color: var(--ink); background: var(--ink); color: #000; }
.plan.done .row-name { color: var(--ink-2); }
.cue { margin-bottom: 14px; }
#next-btn span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.routine { margin-top: 26px; }
.routine:first-of-type { margin-top: 0; }
.routine-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.routine-actions .btn-primary { grid-column: 1 / -1; }
.starter-note { margin-top: 14px; }
.empty { margin: 24px 0 18px; }
.empty h2 { margin-bottom: 6px; font: 600 26px/1.1 var(--num); }
.empty p { max-width: 34ch; margin-bottom: 18px; color: var(--ink-2); }

/* ---------- History ---------- */
.week-grid { display: grid; grid-template-columns: repeat(3, 1fr); }
.week-grid div { padding: 2px 12px; border-left: 1px solid var(--rule); }
.week-grid div:first-child { padding-left: 0; border-left: 0; }
.week-grid b { display: block; font: 600 34px/1.05 var(--num); }
.week-grid span { color: var(--ink-2); font-size: 14px; }
.chart-controls { display: grid; gap: 8px; margin-top: 28px; }
.chart-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 18px 0 10px; }
.chart-head h3 { font: 600 24px/1.15 var(--num); }
.chart-note { color: var(--ink-2); font-size: 14px; }
.chart-note:empty { display: none; }
.chart-box { position: relative; height: 230px; }
.chart-box.is-table, .chart-box.is-empty { height: auto; }
.chart-box.is-empty { padding: 8px 0; }
.chart-offline { margin-bottom: 8px; }
.data-table { width: 100%; border-collapse: collapse; }
.data-table th { padding: 8px 0; border-bottom: 2px solid var(--ink); color: var(--ink-2); font-size: 14px; font-weight: 600; text-align: left; }
.data-table td { padding: 9px 0; border-bottom: 1px solid var(--rule); font-size: 16px; }
.data-table .r { text-align: right; }
.data-table td.r { font: 600 20px/1 var(--num); font-variant-numeric: tabular-nums; }
.more { margin-top: 24px; }

/* ---------- Settings ---------- */
.set-row {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  width: 100%; min-height: 58px; padding: 6px 0;
  border-bottom: 1px solid var(--rule); text-align: left; font-size: 17px;
}
.set-row small { display: block; color: var(--ink-2); font-size: 14px; }
.switch { position: relative; flex: none; width: 60px; height: 34px; border: 2px solid var(--outline); border-radius: 999px; }
.switch::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px;
  border-radius: 50%; background: var(--ink-2); transition: transform .15s;
}
[aria-checked="true"] > .switch { border-color: var(--ink); background: var(--ink); }
[aria-checked="true"] > .switch::after { background: #000; transform: translateX(26px); }
.presets-label { margin: 14px 0 8px; }
.presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.banner { margin-bottom: 18px; padding: 12px 14px; border: 2px solid var(--ink); border-radius: 12px; font-size: 15px; line-height: 1.4; }
.about { margin-top: 28px; }

/* ---------- Rest timer bar ---------- */
#timer { flex: none; padding-top: var(--safe-t); border-bottom: 1px solid var(--rule); background: var(--bg); }
.t-row {
  --on: var(--clock); --off: rgba(255, 179, 0, .11);
  display: flex; align-items: center; gap: 6px;
  height: 60px; padding: 0 10px;
  background: var(--bg); color: var(--ink);
}
.t-open {
  flex: none; display: flex; align-items: center; justify-content: center;
  min-width: 44px; height: 48px; padding: 0 6px; border-radius: 10px; color: var(--ink-2);
}
.t-open:active { background: var(--pressed); }
.t-open .seg { display: none; }
#timer:not([data-state="idle"]) .t-open .seg { display: flex; }
#timer:not([data-state="idle"]) .t-open .ico { display: none; }
.t-round { flex: none; padding-left: 2px; color: var(--ink-2); font-size: 15px; white-space: nowrap; }
.t-presets { flex: 1 1 auto; display: flex; gap: 6px; min-width: 0; }
.t-ctrl { flex: 1 1 auto; display: none; justify-content: flex-end; gap: 6px; }
.t-btn {
  flex: 1 1 0; min-width: 0; height: 44px; padding: 0 6px;
  display: inline-flex; align-items: center; justify-content: center;
  border: 2px solid var(--outline); border-radius: 10px;
  color: inherit; font: 600 21px/1 var(--num); white-space: nowrap;
}
.t-btn:active { background: var(--pressed); }
.t-ico { flex: none; width: 44px; padding: 0; }
.t-ctrl .t-btn { flex: none; min-width: 60px; }
.t-ctrl .t-ico { min-width: 44px; }
#t-repeat, #t-stop { display: none; }
#t-repeat[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: #000; }
#timer[data-state="idle"] #t-repeat { display: inline-flex; }
#timer:not([data-state="idle"]) #t-stop { display: inline-flex; }
#timer[data-state="running"] .t-presets, #timer[data-state="paused"] .t-presets { display: none; }
#timer[data-state="running"] .t-ctrl, #timer[data-state="paused"] .t-ctrl { display: flex; }
#timer[data-invert] .t-row { --on: #000; --off: rgba(0, 0, 0, .13); background: var(--clock); color: #000; }
#timer[data-invert] .t-btn { border-color: #000; }
#timer[data-invert] .t-btn:active { background: rgba(0, 0, 0, .15); }
#timer[data-invert] .t-round { color: #000; }
.t-progress { height: 3px; }
.t-progress i, .b-progress i { display: block; height: 100%; background: var(--clock); transform: scaleX(0); transform-origin: left center; transition: transform .2s linear; }

/* Seven-segment digits, like the LED clock on a gym wall */
.seg { display: flex; align-items: center; gap: 3px; }
.seg svg { display: block; height: 34px; width: auto; }
.seg .d { aspect-ratio: 56 / 100; }
.seg .c { aspect-ratio: 20 / 100; }
.seg polygon { fill: var(--off); }
.seg .on { fill: var(--on); }
[data-state="paused"] .seg { opacity: .5; }

/* ---------- Full-screen timer ---------- */
#bigtimer {
  --on: var(--clock); --off: rgba(255, 179, 0, .12); --knob: #000;
  position: fixed; inset: 0; z-index: 30;
  display: flex; flex-direction: column;
  padding: calc(var(--safe-t) + 6px) calc(var(--safe-r) + 16px) calc(var(--safe-b) + 16px) calc(var(--safe-l) + 16px);
  background: var(--bg); color: var(--ink);
}
#bigtimer[data-invert] { --on: #000; --off: rgba(0, 0, 0, .11); --knob: var(--clock); background: var(--clock); color: #000; }
.b-top { flex: none; display: flex; justify-content: flex-end; }
.b-x { display: inline-flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 12px; color: inherit; }
.b-main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
#b-seg .seg { --h: min(calc(88vw / var(--cells, 2.12)), 42vh); --h: min(calc(88vw / var(--cells, 2.12)), 42dvh); gap: calc(var(--h) * .045); }
#b-seg .seg svg { height: var(--h); }
.b-progress { width: 100%; max-width: 520px; height: 6px; }
#bigtimer[data-invert] .b-progress i { background: #000; }
.b-label { font: 600 30px/1 var(--num); }
.b-foot { flex: none; display: grid; gap: 10px; width: 100%; max-width: 520px; margin: 0 auto; }
.b-row { display: flex; gap: 10px; }
.b-btn, .b-row .t-btn {
  flex: 1 1 0; min-width: 0; height: 60px;
  border: 2px solid currentColor; border-radius: 12px;
  color: inherit; font: 600 26px/1 var(--num);
}
.b-btn:active, .b-row .t-btn:active { background: rgba(128, 128, 128, .3); }
.b-btn[disabled] { opacity: .35; }
.b-switch { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 52px; color: inherit; font-size: 17px; text-align: left; }
#bigtimer .switch { border-color: currentColor; }
#bigtimer .switch::after { background: currentColor; }
#bigtimer [aria-checked="true"] > .switch { background: currentColor; }
#bigtimer [aria-checked="true"] > .switch::after { background: var(--knob); }
@media (orientation: landscape) and (max-height: 520px) {
  .b-main { gap: 8px; }
  #b-seg .seg { --h: min(calc(60vw / var(--cells, 2.12)), 38vh); --h: min(calc(60vw / var(--cells, 2.12)), 38dvh); }
  .b-label { font-size: 22px; }
  .b-foot { grid-template-columns: 1fr 1fr; max-width: none; }
  .b-btn, .b-row .t-btn { height: 48px; font-size: 22px; }
  .b-switch { grid-column: 1 / -1; min-height: 40px; }
}

/* ---------- Sheets ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; justify-content: flex-end; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, .72); opacity: 0; transition: opacity .2s; }
.sheet {
  position: relative; width: 100%; max-width: 560px; margin: 0 auto;
  max-height: calc(100vh - var(--safe-t) - 20px); max-height: calc(100dvh - var(--safe-t) - 20px);
  overflow-y: auto; overscroll-behavior: contain;
  padding: 0 var(--pad) calc(var(--safe-b) + 20px);
  border: 1px solid #4d4d4d; border-bottom: 0; border-radius: 20px 20px 0 0;
  background: var(--raised);
  transform: translateY(100%); transition: transform .24s cubic-bezier(.2, .8, .2, 1);
}
.sheet-wrap.open .sheet { transform: none; }
.sheet-wrap.open .sheet-backdrop { opacity: 1; }
.sheet-head {
  position: sticky; top: 0; z-index: 1;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  margin: 0 -4px 6px 0; padding: 10px 0 6px; background: var(--raised);
}
.sheet-head h2 { font: 600 28px/1.1 var(--num); overflow-wrap: anywhere; }
.sheet p { line-height: 1.45; }

/* ---------- Toast ---------- */
#toasts { position: fixed; z-index: 50; top: calc(var(--safe-t) + 70px); left: 0; right: 0; display: flex; justify-content: center; padding: 0 12px; pointer-events: none; }
.toast {
  display: flex; align-items: center; gap: 12px;
  width: 100%; max-width: 520px; min-height: 52px; padding: 8px 8px 8px 16px;
  border-radius: 12px; background: var(--ink); color: #000;
  font: 500 16px/1.3 var(--ui); box-shadow: 0 10px 28px rgba(0, 0, 0, .7);
  pointer-events: auto; opacity: 0; transform: translateY(-10px); transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: none; }
.toast span { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.toast button { flex: none; height: 40px; padding: 0 14px; border: 2px solid #000; border-radius: 10px; color: #000; font: 600 19px/1 var(--num); }

/* ---------- Sections: the home screen, and the top bar of Schedule and Calories ---------- */
.shell {
  display: flex; flex-direction: column;
  height: 100vh; height: 100dvh;
  max-width: 560px; margin: 0 auto;
  padding: 0 var(--safe-r) 0 var(--safe-l);
}
.home { display: flex; flex-direction: column; padding-top: calc(var(--safe-t) + 18px); padding-bottom: calc(var(--safe-b) + 18px); }
.home-list { flex: 1 0 auto; display: grid; grid-auto-rows: 1fr; gap: 12px; }
.home-card {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  width: 100%; min-height: 112px; padding: 14px 20px;
  border: 2px solid var(--outline); border-radius: 18px; color: var(--ink); text-align: left;
}
.home-card:active { background: var(--pressed); }
.home-main { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.home-name { font: 600 46px/1 var(--num); }
.home-sub { color: var(--ink-2); font-size: 15px; line-height: 1.3; overflow-wrap: anywhere; }
.home-card .ico { flex: none; color: var(--ink-2); }
.topbar { flex: none; padding-top: var(--safe-t); border-bottom: 1px solid var(--rule); background: var(--bg); }
.topbar-row { display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 10px; }
.topbar h1 { font: 600 28px/1 var(--num); }
.actionbar-end { padding-bottom: calc(var(--safe-b) + 12px); }
.row.two { grid-template-columns: minmax(0, 1fr) auto; }

/* ---------- Schedule: month grid, then the picked day's events ---------- */
.cal-week, .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.cal-week { margin-bottom: 2px; color: var(--ink-2); font-size: 13px; line-height: 1.6; text-align: center; }
.cal-grid { row-gap: 2px; touch-action: pan-y; }
.cal-day { display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; padding-top: 4px; border-radius: 12px; color: var(--ink); }
.cal-day:active { background: var(--pressed); }
.cal-day:focus-visible { outline-offset: -3px; }
.cal-num {
  display: flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border: 2px solid transparent; border-radius: 50%;
  font: 600 22px/1 var(--num); font-variant-numeric: tabular-nums;
}
.cal-day.out .cal-num { color: var(--outline); }
.cal-day.now .cal-num { border-color: var(--ink); }
.cal-day[aria-pressed="true"] .cal-num { border-color: var(--ink); background: var(--ink); color: #000; }
.cal-dots { display: flex; gap: 3px; height: 5px; }
.cal-dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--ink-2); }
.cal-none { margin-top: 12px; }
.ev-time { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; white-space: nowrap; }
.ev-time b { font: 600 21px/1 var(--num); font-variant-numeric: tabular-nums; }
.ev-time small { color: var(--ink-2); font-size: 14px; line-height: 1; }
.ev-clear { justify-self: start; }

/* ---------- Calories ---------- */
.cal-total { display: flex; align-items: baseline; gap: 10px; }
.cal-total b { font: 600 64px/1 var(--num); font-variant-numeric: tabular-nums; }
.cal-total .of { color: var(--ink-2); font: 600 24px/1 var(--num); }
.cal-hit { align-self: center; margin-left: auto; width: 34px; height: 34px; border-color: var(--ink); background: var(--ink); color: #000; }
.cal-bar { height: 10px; margin: 12px 0 16px; border-radius: 999px; background: var(--pressed); overflow: hidden; }
.cal-bar i { display: block; height: 100%; border-radius: 999px; background: var(--ink); transform: scaleX(0); transform-origin: left center; transition: transform .4s cubic-bezier(.2, .8, .2, 1); }
.meal-form { margin-top: 24px; }
.meal-add { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; }
.meal-add .btn { min-height: 56px; }
.again-label { margin-top: 18px; }
.cal-switch button { min-height: 52px; font-size: 22px; }
.form-head { margin-top: 0; }

/* Preset meals: up to six big buttons, one tap adds the meal */
.presets-head { margin-top: 22px; }
.presets { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(78px, auto); gap: 10px; margin-top: 12px; }
.preset {
  display: flex; flex-direction: column; justify-content: center; gap: 6px;
  min-height: 78px; padding: 10px 14px; border: 2px solid var(--outline); border-radius: 14px;
  color: var(--ink); text-align: left;
}
.preset:active { background: var(--pressed); }
.preset-name { font: 600 22px/1.05 var(--num); overflow-wrap: break-word; word-break: break-word; }
.preset-cal { color: var(--ink-2); font-size: 15px; }
.preset.preset-blank { align-items: center; justify-content: center; flex-direction: row; border-style: dashed; color: var(--ink-2); font: 600 19px/1 var(--num); }
.preset-edit { display: grid; grid-template-columns: minmax(0, 1fr) 108px; gap: 10px; }

/* Weight */
.w-when { margin: 6px 0 16px; color: var(--ink-2); }
.w-chart-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 26px 0 10px; }
.w-chart-head h2 { font: 600 24px/1 var(--num); }
.w-readout { color: var(--ink-2); font-size: 15px; text-align: right; }
.w-readout b { color: var(--ink); font: 600 20px/1 var(--num); }
.w-svg { display: block; width: 100%; height: auto; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.w-svg text { font-family: inherit; font-size: 12px; fill: #c3c2b7; }
.w-note { margin-top: 8px; }
.w-ranges { margin-top: 12px; }
.ev-time.w-val small { font-size: 15px; }

/* Goal hit: confetti over the whole screen for a few seconds. A tap closes it. */
#party {
  position: fixed; inset: 0; z-index: 60;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0, 0, 0, .86); opacity: 0; transition: opacity .25s;
}
#party.show { opacity: 1; }
#party canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.party-card { position: relative; padding: 0 24px; text-align: center; transform: scale(.5); transition: transform .5s cubic-bezier(.2, 1.7, .4, 1); }
#party.show .party-card { transform: none; }
.party-big { font: 600 88px/1 var(--num); }
.party-sub { margin-top: 14px; font: 600 32px/1.15 var(--num); }

/* ---------- Small screens, reduced motion ---------- */
@media (max-width: 420px) {
  #timer[data-wide] .t-round { display: none; }
}
@media (max-width: 350px) {
  .step { width: 40px; }
  .t-round { display: none; }
  .t-row { gap: 4px; padding: 0 8px; }
  .t-presets { gap: 4px; }
  .t-open { min-width: 40px; padding: 0 2px; }
  .t-open .seg svg { height: 28px; }
  .chip { font-size: 17px; }
  .row-a { min-width: 60px; }
  .row-b { min-width: 50px; }
  .home-name { font-size: 38px; }
  .preset-name { font-size: 19px; }
  .cal-total b { font-size: 52px; }
  .party-big { font-size: 68px; }
}
@media (orientation: landscape) and (max-height: 480px) {

/* ---------- Dates (always local time, stored as YYYY-MM-DD) ---------- */

const fmtNum = (n, decimals = 2) => Number(n).toLocaleString('en-US', { maximumFractionDigits: decimals });

/* ---------- Storage ---------- */

    reps: dist ? null : cleanNum(e.reps, LIMIT.reps, true),

const CAL_MAX = 20000;       // most calories in one meal, or in a daily goal
function normEvent(e) {
  if (!e || typeof e !== 'object' || !parseYmd(e.date)) return null;
  const title = cleanText(e.title, 80);
  if (!title) return null;
  const start = TIME_RE.test(e.start) ? e.start : '';
  const end = start && TIME_RE.test(e.end) && e.end > start ? e.end : '';
  return { id: cleanText(e.id, 64) || uid(), date: e.date, title, start, end, at: Number.isFinite(e.at) ? e.at : Date.now() };
}
function normMeal(m) {

  return { id: cleanText(m.id, 64) || uid(), date: m.date, name: cleanText(m.name, 60), cal, at: Number.isFinite(m.at) ? m.at : Date.now() };
}
/* The daily goal is kept as a list of { date, goal }, oldest first. A goal counts from its date on,

function normGoals(list) {
  const byDay = new Map();
  for (const g of Array.isArray(list) ? list : []) {
    const goal = g && typeof g === 'object' ? cleanNum(g.goal, CAL_MAX, true) : null;
    if (goal && parseYmd(g.date)) byDay.set(g.date, goal);

/* Body weight and the six preset meals were added in 1.5. One weigh-in per day, in pounds. */
const BODY_MAX = 1500;

  const n = typeof w.lb === 'string' ? parseFloat(w.lb) : w.lb;
  if (typeof n !== 'number' || !isFinite(n) || n <= 0) return null;
  const lb = Math.round(Math.min(n, BODY_MAX) * 10) / 10;
  if (!lb) return null;

}

}

    const p = src[i];
    if (!p || typeof p !== 'object') return null;

    return name && cal ? { name, cal } : null;

}
function normState(raw) {

  const ids = new Set();
  const firstOfId = x => x && !ids.has(x.id) && ids.add(x.id);
  const state = {
    v: 1,
    entries: (Array.isArray(src.entries) ? src.entries : []).map(normEntry).filter(firstOfId),
    routines: (Array.isArray(src.routines) ? src.routines : []).map(normRoutine).filter(firstOfId),
    workouts: (Array.isArray(src.workouts) ? src.workouts : []).map(normWorkout).filter(firstOfId),

function load() {
  const raw = storage.get(KEY);
  if (!raw) return normState(null);
  try { return normState(JSON.parse(raw)); }
  catch (err) { storage.set(`${KEY}.unreadable.${Date.now()}`, raw); return normState(null); }   // keep a copy, start clean
}
let S = load();
let saveFailedAt = 0;
function save() {
  const ok = storage.set(KEY, JSON.stringify(S));
  if (!ok) {
    toast('Could not save. Storage on this device is full or blocked. Export a backup in Settings so nothing is lost.', { force: true, long: true });
    saveFailedAt = Date.now();
  }
  return ok;
}

/* ---------- Reading the log ---------- */
const strengthName = () => (S.types.find(t => t.name === 'Strength') || S.types.find(t => t.mode === 'reps') || { name: 'Strength' }).name;
const hasDistance = () => !S.settings.strengthOnly || S.entries.some(e => e.mode === 'dist');
const dataSummary = st => `${count(st.entries.length, 'entry', 'entries')}, ${count(st.routines.length, 'routine')}, ${count(st.events.length, 'event')}, ${count(st.meals.length, 'meal')} and ${count(st.weights.length, 'weigh-in')}`;
const timesDone = id => S.workouts.filter(w => w.routineId === id).length;
const lastDone = id => S.workouts.filter(w => w.routineId === id).map(w => w.date).sort().pop() || '';
function recordWorkout(routineId, name, date) {
  const rec = { id: uid(), routineId, name, date, at: Date.now() };
  S.workouts.push(rec);
  return rec;
}
const dropWorkout = rec => { S.workouts = S.workouts.filter(w => w.id !== rec.id); };
const volumeOf = e => e.mode === 'reps' && e.weight && e.reps ? e.weight * (e.sets || 1) * e.reps : 0;
const distOf = e => e.mode === 'dist' && e.distance ? e.distance : 0;
const newerFirst = (a, b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt;
const sameName = (a, b) => a.trim().toLowerCase() === b.trim().toLowerCase();
const toItem = e => ({ type: e.type, mode: e.mode, exercise: e.exercise, weight: e.weight, sets: e.sets, reps: e.reps, distance: e.distance, duration: e.duration, notes: e.notes });
const entriesOn = date => S.entries.filter(e => e.date === date).sort((a, b) => a.createdAt - b.createdAt);

function lastEntry(type, exercise) {
  return S.entries.filter(e => e.type === type && sameName(e.exercise, exercise)).sort(newerFirst)[0] || null;
}
function recentExercises(type, limit) {
  const out = [], seen = new Set();
  for (const e of S.entries.filter(x => x.type === type).sort(newerFirst)) {
    const key = e.exercise.toLowerCase();
    if (seen.has(key)) continue;
    seen.add(key);
    out.push(e);
    if (out.length >= limit) break;
  }
  return out;
}
function byDate() {
  const map = new Map();
  for (const e of S.entries) { if (!map.has(e.date)) map.set(e.date, []); map.get(e.date).push(e); }
  return [...map.entries()]
    .sort((a, b) => b[0].localeCompare(a[0]))
    .map(([date, list]) => [date, list.sort((a, b) => a.createdAt - b.createdAt)]);
}

/* The two right-hand columns of a row, plus an optional second line. */
function measures(e) {
  if (e.mode === 'dist') {
    return {
      a: e.distance ? `${fmtNum(e.distance)} mi` : '',
      b: e.duration ? fmtDur(e.duration) : '',
      sub: [e.weight ? `${fmtNum(e.weight)} lb load` : '', fmtPace(e.duration, e.distance)].filter(Boolean).join(', '),
    };
  }
  return {
    a: e.weight ? `${fmtNum(e.weight)} lb` : '',
    b: e.sets && e.reps ? `${e.sets} × ${e.reps}` : e.reps ? count(e.reps, 'rep') : e.sets ? count(e.sets, 'set') : '',
    sub: '',
  };
}
function describe(e) {
  const m = measures(e);
  if (e.mode === 'dist') return [m.a && m.b ? `${m.a} in ${m.b}` : m.a || m.b, m.sub].filter(Boolean).join(', ') || 'no numbers';
  return (m.a && m.b ? `${m.b} at ${m.a}` : m.a || m.b) || 'no numbers';

/* ---------- Shared UI: toast, sheets, rows ---------- */
let toastTimer = 0;
function toast(message, opts = {}) {
  /* Right after a failed save, keep that message up instead of a confirmation that would not be true. */
  if (!opts.force && Date.now() - saveFailedAt < 150) return;
  clearTimeout(toastTimer);
  const el = h('div', { class: 'toast' },
    h('span', { text: message }),
    opts.undo && h('button', { type: 'button', onclick: () => { dismiss(); opts.undo(); } }, 'Undo'));
  const dismiss = () => { el.classList.remove('show'); setTimeout(() => el.remove(), 220); };
  $('#toasts').replaceChildren(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));
  toastTimer = setTimeout(dismiss, opts.long ? 9000 : opts.undo ? 6000 : 3200);
}
function announce(message) {
  const el = $('#announce');
  el.textContent = message;
  setTimeout(() => { if (el.textContent === message) el.textContent = ''; }, 4000);
}
function buzz(pattern) {
  if (S.settings.vibrate && navigator.vibrate) { try { navigator.vibrate(pattern); } catch (err) { /* not allowed here */ } }
}

const sheets = [];
let seq = 0;
function syncInert() {
  const big = $('#bigtimer');
  for (const key in SHELLS) $(SHELLS[key]).inert = sheets.length > 0 || !big.hidden;
  big.inert = sheets.length > 0;
  sheets.forEach((s, i) => { s.wrap.inert = i < sheets.length - 1; });
}
/* Bottom sheet. The content sits in a form, so the keyboard's Go key submits it. */
function openSheet({ title, content, onSubmit }) {
  const opener = document.activeElement;
  clearTimeout(toastTimer);
  $('#toasts').replaceChildren();
  const titleId = `sheet-title-${++seq}`;
  const api = { close, wrap: null };
  function close() {
    const i = sheets.indexOf(api);
    if (i < 0) return;
    sheets.splice(i, 1);
    syncInert();
    api.wrap.classList.remove('open');
    setTimeout(() => api.wrap.remove(), 260);
    if (opener && opener.isConnected && opener.focus) opener.focus({ preventScroll: true });
  }
  const panel = h('div', { class: 'sheet', tabindex: '-1' },
    h('div', { class: 'sheet-head' },
      h('h2', { id: titleId, text: title }),
      h('button', { type: 'button', class: 'icon-btn', 'aria-label': 'Close', onclick: () => close() }, icon('x'))),
    h('form', { novalidate: true, autocomplete: 'off', onsubmit: ev => { ev.preventDefault(); if (onSubmit) onSubmit(); } }, content));
  api.wrap = h('div', { class: 'sheet-wrap', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': titleId },
    h('div', { class: 'sheet-backdrop', onclick: () => close() }), panel);
  const openedAt = Date.now();
  api.wrap.addEventListener('click', ev => {
    /* The second half of a double tap lands here. Ignore taps until the sheet has settled. */
    if (Date.now() - openedAt < 350) { ev.stopPropagation(); ev.preventDefault(); }
  }, true);
  $('#sheets').append(api.wrap);
  sheets.push(api);
  syncInert();
  requestAnimationFrame(() => requestAnimationFrame(() => api.wrap.classList.add('open')));
  panel.focus({ preventScroll: true });
  return api;
}

function entryRow(e, onTap) {

    h('span', { class: 'row-main' },
      h('span', { class: 'row-name', text: e.exercise }),
      m.sub && h('span', { class: 'row-sub', text: m.sub }),
      e.notes && h('span', { class: 'row-sub', text: e.notes })),
    h('span', { class: 'row-a', text: m.a }),
    h('span', { class: 'row-b', text: m.b }),

/* Rows grouped under their workout type, each type with its total. */
function typeGroups(list, onTap) {
  const groups = new Map();
  for (const e of list) { if (!groups.has(e.type)) groups.set(e.type, []); groups.get(e.type).push(e); }
  const out = [];
  for (const [type, items] of groups) {
    const vol = items.reduce((sum, e) => sum + volumeOf(e), 0);
    const dist = items.reduce((sum, e) => sum + distOf(e), 0);
    const total = [vol ? `${fmtNum(vol, 0)} lb volume` : '', dist ? `${fmtNum(dist)} mi` : ''].filter(Boolean).join(', ');
    out.push(h('div', { class: 'type-head' }, h('span', { text: type }), total && h('span', { class: 'tot', text: total })));
    for (const e of items) out.push(entryRow(e, onTap));
  }

}

    autocomplete: 'off', autocorrect: 'off', autocapitalize: 'words', spellcheck: 'false', enterkeyhint: 'next',
  });

  const dIn = numInput('d', true), tIn = numInput('t'), lIn = numInput('l', true);
  tIn.placeholder = '0:00';

    id: `${p}-n`, class: 'input', type: 'text', maxlength: '300', autocomplete: 'off',
    placeholder: 'Notes (optional)', 'aria-label': 'Notes', enterkeyhint: 'done',
  });

  const typeGrid = h('div', { class: 'type-grid', role: 'group', 'aria-label': 'Workout type' });
  const repsBtn = h('button', { type: 'button', onclick: () => { setMode('reps'); changed(); } }, 'Sets and reps');
  const distBtn = h('button', { type: 'button', onclick: () => { setMode('dist'); changed(); } }, 'Distance and time');

      h('button', { type: 'button', class: 'step', 'aria-label': `Decrease ${what} by ${step}`, onclick: () => bump(-1) }, '−'),

  const distBlock = h('div', { class: 'block' },
    h('div', { class: 'cols' }, field('Distance (mi)', dIn), field('Time', tIn)),

    field('Load (lbs)', lIn, stepper(lIn, 5, 'load')));

    clearErrors(); drawRecents(); drawHint(); drawPace();
  }
  /* Called when the workout types or the log changed underneath the form. */
  function sync() {
    if (S.settings.strengthOnly && !dirty()) { type = strengthName(); mode = 'reps'; }
    else if (!S.types.some(t => t.name === type) && !dirty()) { type = S.types[0].name; mode = S.types[0].mode; }
    drawTypes(); setMode(mode); drawRecents();
  }
  const dirty = () => inputs.some(input => input.value.trim() !== '');
  const raw = () => ({ type, mode, values: inputs.map(input => input.value) });
  function restore(saved) {
    if (!saved || !Array.isArray(saved.values)) return;
    if (S.types.some(t => t.name === saved.type)) { type = saved.type; mode = saved.mode === 'dist' ? 'dist' : 'reps'; }
    inputs.forEach((input, i) => { input.value = typeof saved.values[i] === 'string' ? saved.values[i] : ''; });
    sync(); drawHint(); drawPace();
  }

  drawTypes(); setMode(mode); drawRecents();
  return { el, read, showError, set, clear, sync, dirty, raw, restore };
}

/* ---------- Changing the log ---------- */
let active = 'start';
let logDate = today();
let dateAuto = true;       // true while the Log tab should follow today's date
const targetText = () => { const n = daysAgo(logDate); return n === 0 ? 'today' : n === 1 ? 'for yesterday' : `for ${fmtDate(logDate)}`; };

function addEntries(list, message, alsoUndo) {
  S.entries.push(...list);
  save();
  refresh();
  buzz(15);
  askPersist();
  const ids = new Set(list.map(e => e.id));
  toast(message, { undo: () => { S.entries = S.entries.filter(e => !ids.has(e.id)); if (alsoUndo) alsoUndo(); save(); refresh(); toast('Removed.'); } });
}
function removeEntries(ids, message) {
  const gone = new Set(ids);
  const removed = S.entries.filter(e => gone.has(e.id));
  if (!removed.length) return;
  S.entries = S.entries.filter(e => !gone.has(e.id));
  save();
  refresh();
  toast(message, { undo: () => {
    const have = new Set(S.entries.map(e => e.id));
    S.entries.push(...removed.filter(e => !have.has(e.id)));
    save(); refresh();
  } });
}
/* Ask the browser not to clear this site's data when space runs low. Asked once, after the first log. */
function askPersist() {
  if (S.settings.askedPersist) return;
  S.settings.askedPersist = true;
  save();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}

function editEntry(entry) {

/* ---------- Log tab ---------- */

/* The half-filled form survives a reload, which phones do often when you switch apps. */
function queueDraft() { clearTimeout(draftTimer); draftTimer = setTimeout(saveDraft, 250); }
function saveDraft() {
  clearTimeout(draftTimer);
  if (logForm.dirty() || !dateAuto) storage.set(DRAFT_KEY, JSON.stringify({ at: Date.now(), date: logDate, auto: dateAuto, form: logForm.raw() }));
  else storage.remove(DRAFT_KEY);
}
function loadDraft() {
  try {
    const draft = JSON.parse(storage.get(DRAFT_KEY) || 'null');
    if (!draft || !(Date.now() - draft.at < 3 * 3600000)) { storage.remove(DRAFT_KEY); return; }
    if (draft.auto === false && parseYmd(draft.date) && draft.date <= today()) { logDate = draft.date; dateAuto = false; }
    logForm.restore(draft.form);

/* ---------- Workout in progress ----------
   Pick a workout on the Start tab before you train. The Log tab then lists
   its exercises, and each one is checked off as you log it. */
const SESSION_HOURS = 12;          // a workout left open longer than this closes itself
const STARTERS = [
  ['Push day', [['Bench press', 4, 6], ['Overhead press', 3, 8], ['Incline dumbbell press', 3, 10], ['Lateral raise', 3, 12], ['Triceps pushdown', 3, 12]]],
  ['Pull day', [['Pull-ups', 3, 8], ['Barbell row', 4, 8], ['Lat pulldown', 3, 10], ['Face pull', 3, 15], ['Dumbbell curl', 3, 12]]],
  ['Leg day', [['Squat', 4, 6], ['Romanian deadlift', 3, 8], ['Leg press', 3, 10], ['Leg curl', 3, 12], ['Calf raise', 4, 12]]],
  ['Arm day', [['Barbell curl', 3, 10], ['Close-grip bench press', 3, 8], ['Hammer curl', 3, 12], ['Skull crusher', 3, 10], ['Triceps pushdown', 3, 12]]],
];
let session = loadSession();       // null, or { name, routineId, startedAt, planAt, date, items: [{ item, entryId }] }
const isDone = x => !!x.entryId && S.entries.some(e => e.id === x.entryId);

function loadSession() {
  try {
    const raw = JSON.parse(storage.get(SESSION_KEY) || 'null');
    const items = raw && Array.isArray(raw.items)
      ? raw.items.map(x => ({ item: normItem(x && x.item), entryId: x && typeof x.entryId === 'string' ? x.entryId : null })).filter(x => x.item)
      : [];
    if (!items.length) { storage.remove(SESSION_KEY); return null; }
    if (!(Date.now() - raw.startedAt < SESSION_HOURS * 3600000)) {
      /* Left open too long. It still counts as done if anything in it was logged. */
      storage.remove(SESSION_KEY);
      if (items.some(x => x.entryId && S.entries.some(e => e.id === x.entryId))) {
        recordWorkout(cleanText(raw.routineId, 64), cleanText(raw.name, 60) || 'Workout', parseYmd(raw.date) ? raw.date : today());
        save();
      }
      return null;
    }
    return {
      name: cleanText(raw.name, 60) || 'Workout', routineId: cleanText(raw.routineId, 64),
      startedAt: raw.startedAt, planAt: Number(raw.planAt) || 0,
      date: parseYmd(raw.date) ? raw.date : today(), items,
    };
  } catch (err) { storage.remove(SESSION_KEY); return null; }
}
function saveSession() {
  if (session) storage.set(SESSION_KEY, JSON.stringify(session)); else storage.remove(SESSION_KEY);
}
function startWorkout(routine) {
  const before = session;
  session = {
    name: routine.name, routineId: routine.id, startedAt: Date.now(),
    planAt: routine.updatedAt || routine.createdAt || 0, date: logDate,
    items: routine.items.map(item => ({ item: clone(item), entryId: null })),
  };
  saveSession();
  show('log');
  $('#log-scroll').scrollTop = 0;
  toast(`Started ${routine.name}.`, before ? { undo: () => { session = before; saveSession(); refresh(); } } : {});
}
/* The numbers to start an exercise from. What you did last time wins, unless the routine was edited since then.
   Anything the routine leaves blank (a starter has no weights) is filled from last time. Time is never carried over. */
function planFor(row) {
  const item = row.item, last = lastEntry(item.type, item.exercise);
  if (!last || last.mode !== item.mode) return { ...item, notes: '' };
  const newer = last.createdAt > session.planAt;
  const pick = key => (newer || item[key] == null ? last[key] : item[key]);
  return { ...item, weight: pick('weight'), sets: pick('sets'), reps: pick('reps'), distance: pick('distance'), duration: newer ? null : item.duration, notes: '' };
}
function finishWorkout() {
  if (!session) return;
  const before = session;
  const total = before.items.length, done = before.items.filter(isDone).length;
  const rec = done ? recordWorkout(before.routineId, before.name, before.date) : null;     // counts toward "times done"
  if (rec) save();
  session = null;
  saveSession();
  if (dateAuto && logDate !== today()) setLogDate(today(), true);
  refresh();
  toast(done === total ? `Finished ${before.name}. ${count(done, 'exercise')} logged.` : `Ended ${before.name}. ${done} of ${total} logged.`,
    { undo: () => { if (rec) { dropWorkout(rec); save(); } session = before; saveSession(); refresh(); } });
}
function expireSession() {
  if (!session || Date.now() - session.startedAt < SESSION_HOURS * 3600000) return;
  if (session.items.some(isDone)) { recordWorkout(session.routineId, session.name, session.date); save(); }
  session = null;
  saveSession();
  if (dateAuto && logDate !== today()) setLogDate(today(), true);
  refresh();
}

/* The Log tab shows either the free entry form or the workout in progress. */

function renderWorkout() {
  const rows = session.items.map(row => ({ row, entry: (row.entryId && S.entries.find(e => e.id === row.entryId)) || null }));
  const done = rows.filter(r => r.entry).length;

function planRow(row, entry, isNext) {

    type: 'button', class: `row plan${entry ? ' done' : isNext ? ' next' : ''}`,
    'aria-label': entry ? `${shown.exercise}, done, ${describe(entry)}. Edit` : `Log ${shown.exercise}${planned}`,

/* Log one exercise of the workout, or an extra one when row is null. */
function logSheet(row) {

  if (row) form.set(planFor(row));
  const sheet = openSheet({

/* Create or edit a routine. seed is a list of items to start from. */
function routineSheet(routine, seed) {
  const draft = routine ? clone(routine) : { id: uid(), name: '', items: clone(seed || []), createdAt: Date.now() };

      ? draft.items.map((item, i) => h('div', { class: 'item-row' },

          h('button', { type: 'button', class: 'icon-btn move', 'aria-label': `Move ${item.exercise} down`, disabled: i === draft.items.length - 1, onclick: () => moveItem(i, 1) }, icon('down'))))

/* Totals per day, week or month, oldest first. */
function buckets(metric, period) {
  const t = today(), out = [];
  let keyOf;
  if (period === 'day') {
    for (let i = 13; i >= 0; i--) { const d = addDays(t, -i); out.push({ key: d, label: shortDate(d), full: fmtDate(d), value: 0 }); }
    keyOf = e => e.date;
  } else if (period === 'week') {
    const start = weekStart(t);
    for (let i = 11; i >= 0; i--) { const d = addDays(start, -7 * i); out.push({ key: d, label: shortDate(d), full: `Week of ${shortDate(d)}`, value: 0 }); }
    keyOf = e => weekStart(e.date);
  } else {
    const now = new Date();
    for (let i = 11; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      out.push({ key: `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`, label: MONTHS[d.getMonth()], full: `${MONTHS[d.getMonth()]} ${d.getFullYear()}`, value: 0 });
    }
    keyOf = e => e.date.slice(0, 7);
  }
  const index = new Map(out.map((b, i) => [b.key, i]));
  const amount = metric === 'volume' ? volumeOf : distOf;
  for (const e of S.entries) { const i = index.get(keyOf(e)); if (i !== undefined) out[i].value += amount(e); }
  for (const b of out) b.value = Math.round(b.value * 100) / 100;
  return out;
}
function killChart() { if (chart) { chart.destroy(); chart = null; } }
function drawChart() {
  const box = $('#chart-box');

  killChart();
  const period = S.settings.period, metric = hasDistance() ? S.settings.metric : 'volume';
  const unit = metric === 'volume' ? 'lb' : 'mi';
  const data = buckets(metric, period);
  const libReady = typeof window.Chart === 'function';
  const toggle = $('#chart-toggle');
  $('#chart-title').textContent = `${metric === 'volume' ? 'Volume' : 'Distance'} per ${period} (${unit})`;
  $('#chart-note').textContent = metric === 'volume' ? 'Weight × sets × reps' : '';
  toggle.hidden = !libReady;

  if (!data.some(b => b.value > 0)) {
    toggle.hidden = true;
    box.className = 'chart-box is-empty';
    box.replaceChildren(h('p', { class: 'muted', text: `No ${metric} logged in the last ${RANGE[period]}.` }));
    return;
  }
  const valueText = v => `${fmtNum(v, metric === 'volume' ? 0 : 2)} ${unit}`;
  if (tableView || !libReady) {
    box.className = 'chart-box is-table';
    fill(box,
      !libReady && chartFailed && h('p', { class: 'muted chart-offline', text: 'The chart needs an internet connection to load. Here are the same numbers.' }),
      h('table', { class: 'data-table' },
        h('thead', null, h('tr', null, h('th', { scope: 'col', text: period === 'day' ? 'Day' : period === 'week' ? 'Week of' : 'Month' }), h('th', { scope: 'col', class: 'r', text: metric === 'volume' ? 'Volume' : 'Distance' }))),
        h('tbody', null, data.slice().reverse().map(b => h('tr', null, h('td', { text: period === 'week' ? b.label : b.full }), h('td', { class: 'r', text: valueText(b.value) }))))));
    return;
  }

  const canvas = h('canvas', { role: 'img', 'aria-label': `Bar chart of ${metric} per ${period}. The Table button shows the same numbers.` });
  box.className = 'chart-box';
  box.replaceChildren(canvas);
  const peak = Math.max(...data.map(b => b.value));
  const font = { family: getComputedStyle(document.body).fontFamily, size: 12 };
  chart = new window.Chart(canvas, {
    type: 'bar',
    data: {
      labels: data.map(b => b.label),

          ticks: { color: CHART_INK, font, padding: 8, maxTicksLimit: 5, callback: v => v === 0 ? '0' : peak >= 10000 ? `${fmtNum(v / 1000, 1)}K` : fmtNum(v) },
        },

function exportBackup() {
  const payload = { app: 'workout-log', version: 1, exportedAt: new Date().toISOString(), entries: S.entries, routines: S.routines, workouts: S.workouts, types: S.types, settings: S.settings, events: S.events, meals: S.meals, calGoals: S.calGoals, weights: S.weights, mealPresets: S.mealPresets };
  const json = JSON.stringify(payload, null, 2);
  const name = `workout-log-${today()}.json`;
  const done = () => { S.settings.lastBackup = Date.now(); save(); if (active === 'settings') renderSettings(); toast('Backup exported.', { force: true }); };
  const download = () => {
    const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
    const link = h('a', { href: url, download: name });
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
    done();
  };
  /* On iPhone the share sheet (Save to Files, AirDrop, Mail) is more dependable than a download, especially from the Home Screen. */
  const iOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let file;
  try { file = new File([json], name, { type: 'application/json' }); } catch (err) { file = null; }
  if (iOS && file && navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file] }).then(done, err => { if (!err || err.name !== 'AbortError') download(); });
    return;
  }
  download();
}
function importBackup(file) {
  const reader = new FileReader();
  reader.onerror = () => toast('Could not read that file.');
  reader.onload = () => {
    let raw;
    try { raw = JSON.parse(String(reader.result)); } catch (err) { toast('That file is not a Workout Log backup.'); return; }
    const incoming = normState(raw);
    /* A backup made before 1.4 knows nothing about the schedule or calories, so it must not wipe them. */
    /* Older backups leave out parts added later (schedule and calories in 1.4, weight and preset meals in 1.5). Those parts stay as they are. */
    const missing = EXTRA_KEYS.filter(k => !raw || Array.isArray(raw) || !Array.isArray(raw[k]));
    const hasExtras = missing.length < EXTRA_KEYS.length;
    const isEmpty = st => !st.entries.length && !st.routines.length && !st.events.length && !st.meals.length && !st.weights.length;
    if (isEmpty(incoming)) { toast('Nothing to import in that file.'); return; }
    if (isEmpty(S)) { applyImport(incoming, true, missing); return; }
    const sheet = openSheet({
      title: 'Import backup',
      content: h('div', { class: 'stack' },
        h('p', { text: `This backup has ${dataSummary(incoming)}. This device has ${dataSummary(S)}.` }),
        missing.length > 0 && h('p', { class: 'muted', text: hasExtras ? 'This backup is from before weight and preset meals were added. Those stay as they are either way.' : 'This backup is from before the schedule and calories were added. Your events, meals and weight stay as they are either way.' }),
        h('button', { type: 'button', class: 'btn btn-block btn-primary', onclick: () => { sheet.close(); applyImport(incoming, false, missing); } }, 'Add to what is here'),
        h('button', { type: 'button', class: 'btn btn-block btn-danger', onclick: () => { sheet.close(); applyImport(incoming, true, missing); } }, 'Replace what is here')),
    });
  };
  reader.readAsText(file);
}
const EXTRA_KEYS = ['events', 'meals', 'calGoals', 'weights', 'mealPresets'];
function applyImport(incoming, replace, missing) {
  const before = clone(S);
  let message;
  if (replace) {
    for (const k of missing) incoming[k] = S[k];
    S = incoming;
    session = null; saveSession();
    message = `Imported. This device now has ${dataSummary(S)}.`;
  } else {
    const have = new Set([...S.entries, ...S.routines, ...S.workouts, ...S.events, ...S.meals].map(x => x.id));
    S.workouts.push(...incoming.workouts.filter(w => !have.has(w.id)));
    const entries = incoming.entries.filter(e => !have.has(e.id));
    const routines = incoming.routines.filter(r => !have.has(r.id));
    const events = incoming.events.filter(e => !have.has(e.id));
    const meals = incoming.meals.filter(m => !have.has(m.id));
    S.entries.push(...entries);
    S.routines.push(...routines);
    S.events.push(...events);
    S.meals.push(...meals);
    S.calGoals = normGoals([...incoming.calGoals, ...S.calGoals]);       // on the same date, the goal already on this device wins
    const weighDays = new Set(S.weights.map(w => w.date));
    const weighs = incoming.weights.filter(w => !weighDays.has(w.date));    // on the same day, the weigh-in already on this device wins
    S.weights = normWeights([...S.weights, ...weighs]);
    if (!S.mealPresets.some(Boolean)) S.mealPresets = incoming.mealPresets;
    for (const t of incoming.types) if (!S.types.some(x => sameName(x.name, t.name))) S.types.push(t);
    const skipped = incoming.entries.length - entries.length;
    message = `Added ${count(entries.length, 'entry', 'entries')}, ${count(routines.length, 'routine')}, ${count(events.length, 'event')}, ${count(meals.length, 'meal')} and ${count(weighs.length, 'weigh-in')}.${skipped ? ` ${count(skipped, 'entry was', 'entries were')} already here.` : ''}`;
  }
  save(); afterDataChange();
  toast(message, { undo: () => { S = before; save(); afterDataChange(); } });
}
function deleteAllSheet() {
  const sheet = openSheet({

    content: h('div', { class: 'stack' },

function fmtTime(s) { const hh = +s.slice(0, 2); return `${hh % 12 || 12}:${s.slice(3, 5)} ${hh < 12 ? 'AM' : 'PM'}`; }
const timeText = e => (e.start ? (e.end ? `${fmtTime(e.start)} to ${fmtTime(e.end)}` : fmtTime(e.start)) : '');
function nearDay(s) { const n = daysAgo(s); return n === 0 ? 'Today' : n === 1 ? 'Yesterday' : n === -1 ? 'Tomorrow' : fmtDate(s); }

}

/* Add an event on the picked day, or edit one. */
function eventSheet(ev) {

/* ---------- Calories ----------
   Set a daily goal, then add each meal with its calories. A day is a hit once its
   total reaches the goal. The streak is how many days in a row were hits. */
let calDate = today();
let calAuto = true;        // true while the page should follow today's date
let calView = 'food';      // 'food' or 'weight'
const FIRE_AT = 5;         // the streak gets a fire from this many days on
const streakText = run => `${run} day streak${run >= FIRE_AT ? ' \u{1F525}' : ''}`;
let lastMealAt = 0;
let lastFrac = 0;          // where the progress bar was, so it slides to its new place
let partyTimer = 0, partyHide = 0, partyStop = null, partyAt = 0;
const mealsOn = date => S.meals.filter(m => m.date === date).sort((a, b) => a.at - b.at);
const dayTotal = date => S.meals.reduce((sum, m) => (m.date === date ? sum + m.cal : sum), 0);
/* The goal in force on a day. 0 means no goal has been set yet. */
function goalFor(date) {
  let goal = 0;
  for (const g of S.calGoals) { if (g.date > date) break; goal = g.goal; }
  return goal || (S.calGoals.length ? S.calGoals[0].goal : 0);       // days before the first goal use the first goal
}
function setGoal(n) {
  const t = today();
  S.calGoals = S.calGoals.filter(g => g.date < t);
  S.calGoals.push({ date: t, goal: n });
}
/* run: days in a row the goal was hit, counting today once today is a hit. Until then yesterday's run still stands. */
function calStats() {
  const totals = new Map();
  for (const m of S.meals) totals.set(m.date, (totals.get(m.date) || 0) + m.cal);
  const hit = d => { const g = goalFor(d); return g > 0 && (totals.get(d) || 0) >= g; };
  let d = today(), run = 0;
  if (!hit(d)) d = addDays(d, -1);
  while (hit(d)) { run += 1; d = addDays(d, -1); }
  let best = run, len = 0, prev = '';
  for (const day of [...totals.keys()].sort()) {
    if (!hit(day)) { len = 0; prev = ''; continue; }
    len = prev && addDays(prev, 1) === day ? len + 1 : 1;
    prev = day;
    if (len > best) best = len;
  }
  return { run, best };
}
function recentMeals(limit) {
  const out = [], seen = new Set();
  for (const m of S.meals.slice().sort((a, b) => b.at - a.at)) {
    if (!m.name) continue;
    const key = `${m.name.toLowerCase()}|${m.cal}`;
    if (seen.has(key)) continue;
    seen.add(key);
    out.push(m);
    if (out.length >= limit) break;
  }
  return out;
}

function setCalDate(date) {
  calDate = parseYmd(date) && date <= today() ? date : today();
  calAuto = calDate === today();
  renderCalories();
}
function renderCalories() {
  for (const btn of document.querySelectorAll('[data-cview]')) btn.setAttribute('aria-pressed', String(btn.dataset.cview === calView));
  $('#food-view').hidden = calView !== 'food';
  $('#weight-view').hidden = calView !== 'weight';
  if (calView === 'weight') { renderWeight(); return; }
  const t = today();
  if (calDate > t) calDate = t;
  const ready = S.calGoals.length > 0;
  $('#c-dates').hidden = !ready;
  $('#meal-form').hidden = !ready;
  if (!ready) {
    fill($('#cal-top'), emptyState('Daily calorie goal', 'Set the number of calories you want to hit each day. You can change it any time.', 'Set goal', goalSheet));
    fill($('#cal-presets'));
    fill($('#cal-list'));
    return;
  }
  fill($('#cal-presets'), presetsBlock());
  $('#meal-head').textContent = S.mealPresets.some(Boolean) ? 'Other meal' : 'Add a meal';
  const isToday = calDate === t, ago = daysAgo(calDate);
  $('#c-main').textContent = isToday ? 'Today' : fmtDate(calDate);
  $('#c-side').textContent = isToday ? fmtDate(calDate) : ago === 1 ? 'yesterday' : `${ago} days ago`;
  $('#c-pick').classList.toggle('past', !isToday);
  $('#c-next').disabled = isToday;
  $('#c-input').max = t;
  $('#c-input').value = calDate;

  const goal = goalFor(calDate), list = mealsOn(calDate);
  const total = list.reduce((sum, m) => sum + m.cal, 0);
  const stats = calStats();
  const frac = Math.min(1, total / goal);
  const bar = h('i');
  bar.style.transform = `scaleX(${lastFrac.toFixed(4)})`;
  requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.transform = `scaleX(${frac.toFixed(4)})`; }));
  lastFrac = frac;
  const cell = (value, label) => h('div', null, h('b', { text: value }), h('span', { text: label }));
  fill($('#cal-top'),
    h('p', { class: 'cal-total' },
      h('b', { text: fmtNum(total, 0) }),
      h('span', { class: 'of', text: `of ${fmtNum(goal, 0)} cal` }),
      total >= goal && h('span', { class: 'mark cal-hit', role: 'img', 'aria-label': 'Goal hit' }, icon('check', 18))),
    h('div', { class: 'cal-bar', 'aria-hidden': 'true' }, bar),
    h('div', { class: 'week-grid' },
      total >= goal ? cell(fmtNum(total - goal, 0), 'over goal') : cell(fmtNum(goal - total, 0), 'to go'),
      cell(stats.run >= FIRE_AT ? `${stats.run} \u{1F525}` : String(stats.run), 'day streak'),
      cell(String(stats.best), 'best streak')));

  const isPreset = m => S.mealPresets.some(p => p && sameName(p.name, m.name) && p.cal === m.cal);
  const again = recentMeals(14).filter(m => !isPreset(m)).slice(0, 6);
  fill($('#cal-list'),
    again.length > 0 && [
      h('p', { class: 'muted again-label', text: 'Add again' }),
      h('div', { class: 'recents', role: 'group', 'aria-label': 'Add a recent meal again' }, again.map(m => h('button', {
        type: 'button', class: 'chip', 'aria-label': `Add ${m.name}, ${m.cal} calories`, onclick: () => quickMeal(m),
      }, `${m.name} ${fmtNum(m.cal, 0)}`)))],
    h('h2', { class: 'sub', text: `Eaten ${whenText(calDate)}` }),
    list.length
      ? list.map(m => h('button', { type: 'button', class: 'row two', 'aria-label': `Edit ${m.name || 'meal'}, ${m.cal} calories`, onclick: () => mealSheet(m) },
          h('span', { class: 'row-main' }, h('span', { class: 'row-name', text: m.name || 'Meal' })),
          h('span', { class: 'row-a', text: `${fmtNum(m.cal, 0)} cal` })))
      : h('p', { class: 'muted', text: 'Nothing yet. Meals you add show up here.' }),
    h('button', { type: 'button', class: 'btn btn-block more', onclick: goalSheet }, 'Change goal'));
}

/* Adding a meal that carries the day's total up to the goal sets off the celebration. */
function addMeal(meal) {
  const goal = goalFor(meal.date), before = dayTotal(meal.date);
  S.meals.push(meal);
  lastMealAt = Date.now();
  save(); refresh(); buzz(15); askPersist();
  toast(`Added ${meal.name || 'meal'}, ${fmtNum(meal.cal, 0)} cal.`, { undo: () => { S.meals = S.meals.filter(m => m.id !== meal.id); save(); refresh(); toast('Removed.'); } });
  if (goal > 0 && before < goal && before + meal.cal >= goal) celebrate(meal.date);
}
function submitMeal(ev) {

  if (!cal) { fieldError(calIn, 'Enter the calories.'); return; }

}

}

/* Paper bits shot up from the two bottom corners, falling back down. Returns a function that stops it. */
function confetti(canvas, ms) {
  const ctx = canvas.getContext ? canvas.getContext('2d') : null;

  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const COLORS = ['#ffffff', '#ffb300', '#3987e5', '#35c46a', '#ff6b6b'];
  const bits = [];
  for (let i = 0; i < 160; i++) {
    const fromLeft = i % 2 === 0;
    const angle = (fromLeft ? -1.05 : -2.09) + (Math.random() - 0.5);       // up and toward the middle
    const power = 0.9 + Math.random();
    bits.push({
      x: fromLeft ? -10 : W + 10, y: H + 10,
      vx: Math.cos(angle) * W * power * 0.9, vy: Math.sin(angle) * H * power,
      w: 6 + Math.random() * 6, h: 10 + Math.random() * 8,
      spin: Math.random() * 6.28, vs: (Math.random() - 0.5) * 10,
      flip: Math.random() * 6.28, vf: 4 + Math.random() * 8,
      color: COLORS[i % COLORS.length], delay: Math.random() * 0.4,
    });

  const frame = now => {
    if (!t0) { t0 = now; last = now; }
    const dt = Math.min(0.05, (now - last) / 1000), age = (now - t0) / 1000;
    last = now;
    ctx.clearRect(0, 0, W, H);
    ctx.globalAlpha = Math.max(0, Math.min(1, (ms / 1000 - age) / 0.6));
    for (const b of bits) {
      if (age < b.delay) continue;
      b.vy += H * 1.5 * dt;                       // gravity
      b.vx -= b.vx * 0.8 * dt;
      if (b.vy > 0) b.vy -= b.vy * 2.2 * dt;      // paper falls slowly
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.spin += b.vs * dt;
      b.flip += b.vf * dt;
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.spin);
      ctx.scale(1, Math.cos(b.flip));
      ctx.fillStyle = b.color;
      ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
      ctx.restore();

}
